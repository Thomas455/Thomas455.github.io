<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快捷导航 · Thomas455</title>
  <meta name="description" content="常用网站快捷导航，支持快速搜索。">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* ===== 导航页 ===== */
    .nav-hero {
      min-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 32px 0;
    }

    .nav-hero h1 {
      font-size: 1.6rem;
      margin: 0;
    }

    /* 吸顶后压缩首屏区，内容立即跟上 */
    body.search-pinned .nav-hero {
      min-height: 160px;
      justify-content: flex-start;
      padding-top: 16px;
    }

    /* 下滑提示 */
    .scroll-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 16px;
    }

    .scroll-hint .arrow {
      width: 16px;
      height: 16px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
      animation: hint-bounce 1.6s infinite;
    }

    @keyframes hint-bounce {
      0%, 100% { transform: rotate(45deg) translate(0, 0); }
      50% { transform: rotate(45deg) translate(4px, 4px); }
    }

    body.search-pinned .scroll-hint {
      display: none;
    }

    #search-wrap {
      width: 100%;
    }

    #search-wrap.fixed {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      z-index: 5;
      padding: 12px 0 16px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    #search {
      display: block;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 12px 20px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      outline: none;
      background: #fff;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      padding: 24px 0 64px;
    }

    .ncard {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 18px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      color: var(--text);
      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
    }

    .ncard:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(31, 35, 40, 0.08);
      transform: translateY(-2px);
      text-decoration: none;
    }

    .nicon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      overflow: hidden;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nicon img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .nicon.has-img img {
      opacity: 1;
    }

    .nicon.no-img img {
      display: none;
    }

    .nletter {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .nicon.has-img .nletter {
      display: none;
    }

    .nname {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .ndomain {
      font-size: 0.72rem;
      color: var(--muted);
      word-break: break-all;
      max-width: 100%;
    }

    .empty-tip {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
    }

    @media (max-width: 640px) {
      .nav-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 10px;
      }
    }
  </style>

    const search = document.getElementById('search');
    const grid = document.getElementById('grid');

    // 名字 -> 稳定颜色（HSL）
    function hueOf(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
      return h;
    }

    function cardEl(site) {
      let host;
      try { host = new URL(site.u).hostname; } catch (e) { host = site.u; }
      const a = document.createElement('a');
      a.className = 'ncard';
      a.href = site.u;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML =
        '<span class="nicon">' +
          '<img alt="" src="https://' + host + '/favicon.ico"' +
            ' referrerpolicy="no-referrer"' +
            ' onload="this.style.opacity=1;this.parentNode.classList.add(\'has-img\')"' +
            ' onerror="if(this.src.indexOf(\'cn.bing.com\')===-1){this.src=\'https://cn.bing.com/favicon.ico?host=' + host + '\';}else{this.parentNode.classList.add(\'no-img\');}">' +
          '<span class="nletter" style="background:hsl(' + hueOf(site.n) + ',65%,50%)">' +
            site.n.charAt(0) +
          '</span>' +
        '</span>' +
        '<span class="nname">' + site.n + '</span>' +
        '<span class="ndomain">' + host + '</span>';
      return a;
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      grid.innerHTML = '';
      let count = 0;
      SITES.forEach(s => {
        if (q && !(s.n.toLowerCase().includes(q) || s.u.toLowerCase().includes(q) || s.c.toLowerCase().includes(q))) return;
        grid.appendChild(cardEl(s));
        count++;
      });
      if (count === 0) {
        const tip = document.createElement('div');
        tip.className = 'empty-tip';
        tip.textContent = '没有找到匹配的网站';
        grid.appendChild(tip);
      }
    }

    // 回车打开第一个结果
    search.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const first = grid.querySelector('.ncard');
        if (first) window.open(first.href, '_blank');
      } else if (e.key === 'Escape') {
        search.value = '';
        render();
        updateSearchSticky();
      }
    });

    // 初始渲染
    render();

    // 搜索栏吸顶：滚动超过顶栏，或搜索框有输入内容时，固定在顶栏下方并压缩首屏让内容跟上
    const searchWrap = document.getElementById('search-wrap');
    function updateSearchSticky() {
      const pinned = window.scrollY > 56 || search.value.trim() !== '';
      searchWrap.classList.toggle('fixed', pinned);
      document.body.classList.toggle('search-pinned', pinned);
    }
    window.addEventListener('scroll', updateSearchSticky, { passive: true });
    window.addEventListener('resize', updateSearchSticky);

    // 输入内容时立即压缩首屏，让搜索结果马上上来
    search.addEventListener('input', () => {
      render();
      updateSearchSticky();
    });
    updateSearchSticky();
