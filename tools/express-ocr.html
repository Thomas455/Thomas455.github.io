<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>快递 OCR 查找 · Thomas455</title>
  <meta name="description" content="摄像头实时 OCR 找快递：全屏扫货架，识别到的单号当场用红框标出；输入自己的单号，命中时高亮提示。全程本地处理，画面不上传。">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    :root {
      --cam-bg: #0b0d10;
      --hit: #ef4444;
      --hit-strong: #dc2626;
    }

    /* ===== 全屏应用布局 ===== */
    html, body { height: 100%; }
    body.ocr-app {
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      background: var(--cam-bg);
      color: #e6edf3;
      user-select: none;
      -webkit-user-select: none;
    }
    body.ocr-app .site-header,
    body.ocr-app .site-footer { display: none; }
    body.ocr-app a { color: #93c5fd; }

    /* ===== 摄像头舞台 ===== */
    .stage {
      position: fixed; inset: 0;
      background: var(--cam-bg);
      overflow: hidden;
      z-index: 1;
    }
    .stage video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .stage canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .cam-off {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
      background: radial-gradient(circle at 50% 40%, #1b2029 0%, #0b0d10 70%);
      color: rgba(230, 237, 243, 0.6);
      font-size: 0.92rem;
      text-align: center;
      padding: 24px;
    }
    .cam-off .big { font-size: 3rem; line-height: 1; }
    .cam-off .tip { font-size: 0.8rem; max-width: 420px; line-height: 1.7; color: rgba(230, 237, 243, 0.42); }

    /* ===== 顶栏 ===== */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .topbar .back {
      width: 38px; height: 38px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff !important;
      font-size: 1.1rem;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    .topbar .back:hover { background: rgba(255, 255, 255, 0.22); }
    .topbar .title {
      font-size: 0.95rem; font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .icon-btn {
      width: 38px; height: 38px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.22); }

    /* ===== 单号输入条（支持多个单号） ===== */
    .targetbar {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 58px);
      left: 14px; right: 14px;
      z-index: 22;
      display: flex; align-items: center; gap: 8px;
    }
    .targetbar .field {
      flex: 1; min-width: 0;
      position: relative;
      display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
      padding: 6px 10px 6px 36px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 18, 23, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: border-color 0.2s, box-shadow 0.2s;
      max-height: 34vh;
      overflow-y: auto;
    }
    .targetbar .field:focus-within {
      border-color: rgba(239, 68, 68, 0.85);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.22);
    }
    .targetbar .lens {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      font-size: 0.95rem; opacity: 0.6;
      pointer-events: none;
    }
    .targetbar input {
      flex: 1 1 140px;
      min-width: 90px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 0.92rem;
      letter-spacing: 0.5px;
      outline: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 5px 2px;
    }
    .targetbar input::placeholder { color: rgba(255, 255, 255, 0.42); font-family: inherit; letter-spacing: 0; }

    /* 手机友好：不依赖键盘回车，始终有个「添加」按钮 */
    .addbtn {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 999px;
      border: none;
      background: #ef4444;
      color: #fff;
      font-size: 0.8rem; font-weight: 700;
      cursor: pointer;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .addbtn:active { background: #dc2626; transform: scale(0.96); }
    .addbtn:disabled { opacity: 0.4; cursor: default; }

    /* 已添加的单号标签 */
    .chips { display: contents; }
    .tchip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 6px 4px 10px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      font-size: 0.78rem; font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.3px;
      max-width: 100%;
      animation: chipIn 0.16s ease-out;
    }
    @keyframes chipIn { from { transform: scale(0.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .tchip .x {
      width: 17px; height: 17px;
      display: flex; align-items: center; justify-content: center;
      border: none; border-radius: 50%;
      background: rgba(0, 0, 0, 0.28);
      color: #fff; font-size: 0.72rem; line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
    }
    .tchip .x:hover { background: rgba(0, 0, 0, 0.5); }
    .tchip.found { background: #16a34a; }
    .tchip .ok { font-size: 0.72rem; }

    /* ===== 命中横幅 ===== */
    /* 放在顶部单号栏下方，避免遮挡底部抽屉与画面上方的单号 */
    .found-banner {
      position: fixed; left: 50%;
      top: calc(env(safe-area-inset-top, 0px) + 112px);
      transform: translateX(-50%) scale(0.9);
      z-index: 30;
      padding: 13px 26px;
      border-radius: 16px;
      background: rgba(220, 38, 38, 0.95);
      color: #fff;
      font-size: 1rem; font-weight: 800;
      letter-spacing: 0.5px;
      text-align: center;
      box-shadow: 0 12px 44px rgba(220, 38, 38, 0.55);
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      max-width: 88vw;
      word-break: break-all;
    }
    .found-banner.show { opacity: 1; transform: translateX(-50%) scale(1); }
    .found-banner small { display: block; font-size: 0.78rem; font-weight: 500; opacity: 0.9; margin-top: 4px; }

    /* ===== 底部控制 ===== */
    .bottom {
      position: fixed; left: 0; right: 0; bottom: 0;
      z-index: 30;                 /* 高于抽屉，抽屉打开时仍可点 */
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.86) 0%, rgba(0, 0, 0, 0.5) 62%, rgba(0, 0, 0, 0) 100%);
    }
    .cam-btn {
      flex-shrink: 0;
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      background: #fff;
      color: #0b0d10;
      font-size: 0.92rem; font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
    .cam-btn:hover { background: #e6edf3; }
    .cam-btn.stop { background: rgba(255, 255, 255, 0.16); color: #fff; border: 1px solid rgba(255, 255, 255, 0.28); }
    .cam-stat {
      flex: 1; min-width: 0;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      line-height: 1.4;
    }
    .sheet-toggle {
      flex-shrink: 0;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-size: 0.84rem; font-weight: 600;
      cursor: pointer;
    }
    .sheet-toggle b { color: #fca5a5; }

    /* ===== 结果抽屉 ===== */
    .sheet {
      position: fixed; left: 0; right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);   /* 让出底部控制条 */
      z-index: 25;
      height: 58vh;
      max-height: 58vh;
      transform: translateY(calc(100% + 80px));
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      background: rgba(15, 18, 23, 0.94);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px 20px 0 0;
      display: flex; flex-direction: column;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 10px;
      flex-shrink: 0;
    }
    .sheet-head .grip {
      position: absolute; left: 50%; top: 6px;
      transform: translateX(-50%);
      width: 40px; height: 4px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
    }
    .sheet-head h3 { font-size: 0.95rem; color: #fff; flex: 1; }
    .sheet-head .stat { font-size: 0.78rem; color: rgba(255, 255, 255, 0.55); }
    .sheet-tools {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 0 16px 10px;
      flex-shrink: 0;
    }
    .chip-btn {
      padding: 6px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.08);
      color: #e6edf3;
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer;
    }
    .chip-btn:hover { background: rgba(255, 255, 255, 0.16); }
    .chip-btn.danger { border-color: rgba(239, 68, 68, 0.5); color: #fca5a5; }
    .chip-btn.danger:hover { background: rgba(239, 68, 68, 0.18); }

    .sheet-list {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0 16px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
      align-content: start;
    }
    .res-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 13px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 3px solid rgba(16, 185, 129, 0.7);   /* 正常：绿色左侧条 */
    }
    /* 存疑：低置信度，用黄色条提示，但结果照常保留 */
    .res-item.is-doubt {
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.4);
      border-left-color: #f59e0b;
    }
    /* 命中我自己输入的单号：整块红色高亮，与画面上的红框对应 */
    .res-item.is-target {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.6);
      border-left-color: #ff2d2d;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
    }
    .res-main { flex: 1; min-width: 0; }
    .res-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95rem; font-weight: 700;
      color: #fff;
      word-break: break-all;
    }
    .res-meta { font-size: 0.72rem; color: rgba(255, 255, 255, 0.5); margin-top: 2px; }
    .res-meta .tag {
      display: inline-block;
      padding: 1px 7px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      margin-right: 4px;
    }
    .res-meta .tag.hit { background: rgba(239, 68, 68, 0.28); color: #fecaca; }
    .res-meta .tag.doubt { background: rgba(245, 158, 11, 0.28); color: #fde68a; }
    .res-act {
      flex-shrink: 0;
      display: flex; flex-direction: column; gap: 5px;
    }
    .res-act button {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      color: #cbd5e1;
      font-size: 0.7rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .res-act button:hover { background: rgba(255, 255, 255, 0.12); }
    .res-act button.del { border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }

    .empty-tip {
      grid-column: 1 / -1;
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      padding: 40px 0;
    }

    /* ===== 设置面板 ===== */
    .settings-panel {
      position: fixed; inset: 0;
      z-index: 40;
      display: none;
      align-items: center; justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .settings-panel.open { display: flex; }
    .settings-card {
      width: 100%; max-width: 380px;
      border-radius: 16px;
      background: #151a21;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 20px;
      color: #e6edf3;
    }
    .settings-card h3 { font-size: 1rem; margin-bottom: 16px; color: #fff; }
    .set-row { margin-bottom: 16px; }
    .set-row label { display: block; font-size: 0.78rem; font-weight: 700; color: rgba(255, 255, 255, 0.55); margin-bottom: 6px; }
    .set-row select, .set-row input[type="number"] {
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .set-row select:focus, .set-row input:focus { border-color: rgba(239, 68, 68, 0.7); }
    .set-row .hint { font-size: 0.72rem; color: rgba(255, 255, 255, 0.4); margin-top: 5px; }
    .set-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .set-actions button {
      padding: 9px 20px;
      border-radius: 999px;
      font-size: 0.85rem; font-weight: 700;
      cursor: pointer;
      border: none;
    }
    .set-actions .ok { background: #ef4444; color: #fff; }
    .set-actions .ok:hover { background: #dc2626; }

    /* ===== Toast ===== */
    .toast {
      position: fixed; left: 50%; bottom: 96px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(230, 237, 243, 0.95);
      color: #0b0d10;
      padding: 9px 20px; border-radius: 999px;
      font-size: 0.85rem; font-weight: 600;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 60;
      max-width: 88vw;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 900px) {
      .sheet { height: 54vh; max-height: 54vh; }
    }

    /* 窄屏：顶栏收紧，输入框下移，避免和预览标签重叠 */
    @media (max-width: 560px) {
      .topbar { padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px; gap: 8px; }
      .topbar .title { font-size: 0.88rem; }
      .topbar .back, .icon-btn { width: 34px; height: 34px; font-size: 1rem; }
      /* 竖屏拍摄时画面横向被裁得厉害，输入区放到标题正下方并收紧，
         给画面上方的单号留出可见区域 */
      .targetbar {
        top: calc(env(safe-area-inset-top, 0px) + 50px);
        left: 10px; right: 10px;
      }
      .targetbar .field {
        padding: 5px 6px 5px 30px;
        border-radius: 14px;
        gap: 4px;
        max-height: 26vh;
      }
      .targetbar .lens { left: 10px; font-size: 0.85rem; }
      .targetbar input { font-size: 0.82rem; padding: 4px 2px; min-width: 70px; }
      .tchip { font-size: 0.72rem; padding: 3px 5px 3px 8px; gap: 5px; }
      .tchip .x { width: 15px; height: 15px; font-size: 0.66rem; }
      .addbtn { padding: 5px 11px; font-size: 0.74rem; }
      .bottom { padding: 10px 10px calc(env(safe-area-inset-bottom, 0px) + 10px); gap: 8px; }
      .cam-btn { padding: 11px 16px; font-size: 0.86rem; }
      .cam-stat { font-size: 0.7rem; }
      .sheet-toggle { padding: 9px 13px; font-size: 0.78rem; }
      .sheet-list { grid-template-columns: 1fr; }
      .found-banner {
        top: auto;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 78px);
        padding: 11px 20px; font-size: 0.92rem;
      }
    }

    /* 手机弹出键盘时：把输入区顶到可视区顶部，避免被键盘挡住 */
    .keyboard-open .targetbar {
      top: calc(env(safe-area-inset-top, 0px) + 8px);
    }
    .keyboard-open .topbar { opacity: 0.25; }
    .keyboard-open .bottom { opacity: 0.35; }
  </style>
</head>
<body class="ocr-app">

  <!-- 摄像头全屏舞台 -->
  <div class="stage" id="camStage">
    <video id="camVideo" playsinline muted autoplay></video>
    <canvas id="camOverlay"></canvas>
    <div class="cam-off" id="camOff">
      <div class="big">📷</div>
      <div>摄像头未开启</div>
      <div class="tip">点下方「开启摄像头」，把镜头对准快递单号即可。<br>需要 HTTPS 或 localhost 才能调用摄像头。</div>
    </div>
  </div>

  <!-- 顶栏 -->
  <header class="topbar">
    <a class="back" href="../tools.html" title="返回在线工具">←</a>
    <div class="title">快递 OCR 查找</div>
    <button class="icon-btn" id="settingsBtn" title="设置">⚙</button>
  </header>

  <!-- 我的单号（支持多个） -->
  <div class="targetbar">
    <div class="field" id="targetField">
      <span class="lens">🔍</span>
      <div class="chips" id="targetChips"></div>
      <input id="targetInput" type="text" inputmode="text" enterkeyhint="done"
             autocomplete="off" autocapitalize="characters" spellcheck="false"
             placeholder="输入单号，点「添加」或按回车">
      <button class="addbtn" id="targetAdd" type="button" title="添加这个单号">添加</button>
    </div>
  </div>

  <!-- 命中提示 -->
  <div class="found-banner" id="foundBanner"></div>

  <!-- 底部控制 -->
  <div class="bottom">
    <button class="cam-btn" id="camStartBtn">开启摄像头</button>
    <button class="cam-btn stop" id="camStopBtn" style="display:none">停止</button>
    <span class="cam-stat" id="camStat"></span>
    <button class="sheet-toggle" id="sheetToggle">结果 <b id="resCount">0</b></button>
  </div>

  <!-- 结果抽屉 -->
  <section class="sheet" id="sheet">
    <div class="sheet-head">
      <span class="grip"></span>
      <h3>识别到的单号</h3>
      <span class="stat" id="sheetStat"></span>
    </div>
    <div class="sheet-tools">
      <button class="chip-btn" id="copyAllBtn">复制全部</button>
      <button class="chip-btn" id="exportCsvBtn">导出 CSV</button>
      <button class="chip-btn" id="exportJsonBtn">导出 JSON</button>
      <button class="chip-btn danger" id="clearResultsBtn">清空</button>
    </div>
    <div class="sheet-list" id="resultGrid"></div>
  </section>

  <!-- 设置 -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-card">
      <h3>识别设置</h3>
      <div class="set-row">
        <label>识别档位</label>
        <select id="quality">
          <option value="fast">省流量（语言包 ~3 MB，最快）</option>
          <option value="balanced" selected>均衡（推荐）</option>
          <option value="accurate">精细（多跑一遍预处理，慢一点）</option>
        </select>
        <div class="hint">档位越高越准，但每帧更慢</div>
      </div>
      <div class="set-row">
        <label>单号最少位数</label>
        <input type="number" id="minLen" value="6" min="3" max="20">
        <div class="hint">小于该位数的识别结果会被忽略</div>
      </div>
      <div class="set-actions">
        <button class="ok" id="settingsClose">完成</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../assets/js/tools-recent.js"></script>
  <script>
    /* ================= 配置 ================= */
    // 镜像源。OCR 引擎 + 语言包都在国外 CDN 上，国内直连经常只有 1MB/s 甚至超时，
    // 因此按「国内优先、国外兜底」的顺序排，逐个探测直到成功。
    //
    // probe 字段必须是「一个真实文件」：目录路径在 npmmirror 返回 404、
    // 在 unpkg 直接 CORS 报错，探测必然失败（实测踩过这个坑）。
    //
    // 实测（广州电信）：
    //   语言包 best_int 2.9MB：unpkg / testingcf.jsdelivr ~2.6 MB/s
    //                           tessdata.projectnaptha.com ~1.0 MB/s（最慢，仅兜底）
    //   JS/wasm：npmmirror / baomitu / staticfile 均可用且快
    const MIRRORS = {
      lib: [
        { base: 'https://registry.npmmirror.com/tesseract.js/5.1.1/files/dist', probe: 'tesseract.min.js' },
        { base: 'https://lib.baomitu.com/tesseract.js/5.1.1', probe: 'tesseract.min.js' },
        { base: 'https://cdn.staticfile.org/tesseract.js/5.1.1', probe: 'tesseract.min.js' },
        { base: 'https://unpkg.com/tesseract.js@5.1.1/dist', probe: 'tesseract.min.js' },
        { base: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist', probe: 'tesseract.min.js' },
      ],
      core: [
        { base: 'https://registry.npmmirror.com/tesseract.js-core/5.1.1/files', probe: 'tesseract-core.wasm' },
        { base: 'https://unpkg.com/tesseract.js-core@5.1.1', probe: 'tesseract-core.wasm' },
        { base: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1', probe: 'tesseract-core.wasm' },
      ],
      // 语言包：首选「best_int」量化版（2.9MB，精度实测与 11MB 标准版一致），
      // 最后才是最慢的 projectnaptha 官方源。
      lang: [
        { base: 'https://unpkg.com/@tesseract.js-data/eng@1.0.0/4.0.0_best_int', probe: 'eng.traineddata.gz' },
        { base: 'https://testingcf.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int', probe: 'eng.traineddata.gz' },
        { base: 'https://fastly.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int', probe: 'eng.traineddata.gz' },
        { base: 'https://tessdata.projectnaptha.com/4.0.0', probe: 'eng.traineddata.gz' },
      ],
    };
    const LANG_NAME = 'eng';

    // 档位 -> 处理的画面边长上限 + 是否做预处理。
    // 注意：这里的 maxSide 直接决定「会不会丢字」。
    // 实测 960x720 的货架图缩到 900 后，B2-2-23432 就识别不出来了；
    // 保持原尺寸则能正确识别。宁可慢一点，也不能因为缩放而丢字。
    const PROFILES = {
      fast:     { maxSide: 1000, preprocess: false },
      balanced: { maxSide: 1400, preprocess: false },
      accurate: { maxSide: 1800, preprocess: true },
    };

    /* ================= 元素 ================= */
    const $ = id => document.getElementById(id);
    const camVideo = $('camVideo'), camOverlay = $('camOverlay'), camOff = $('camOff');
    const camStartBtn = $('camStartBtn'), camStopBtn = $('camStopBtn'), camStat = $('camStat');
    const targetInput = $('targetInput'), targetChips = $('targetChips');
    const foundBanner = $('foundBanner');
    const sheet = $('sheet'), sheetToggle = $('sheetToggle'), resCount = $('resCount'), sheetStat = $('sheetStat');
    const resultGrid = $('resultGrid'), clearResultsBtn = $('clearResultsBtn');
    const copyAllBtn = $('copyAllBtn'), exportCsvBtn = $('exportCsvBtn'), exportJsonBtn = $('exportJsonBtn');
    const qualitySel = $('quality'), minLenInput = $('minLen');
    const settingsBtn = $('settingsBtn'), settingsPanel = $('settingsPanel'), settingsClose = $('settingsClose');
    const toastEl = $('toast');

    /* ================= 状态 ================= */
    let camStream = null;
    let camRunning = false;
    let camBusy = false;          // 一帧正在识别中，避免叠帧
    let camRAF = 0;
    let camWorker = null;
    let camLastShot = '';         // 上一帧的画面指纹，跳过重复帧
    let lastDetections = [];      // 最近一帧的识别结果，用于即时重绘
    let camScannedFrames = 0;
    let camIdleFrames = 0;        // 连续多少帧画面没变，用于触发补扫
    let found = [];               // {id, code, conf, courier, at}
    let seq = 0;
    let bannerTimer = null;
    let lastHitCode = '';
    let bannerShownCodes = new Set();   // 已经弹过横幅的单号，避免重复弹

    /* ================= 通用工具 ================= */
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    let toastTimer = null;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
    }

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return true; }
      catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
        ta.remove();
        return ok;
      }
    }

    function download(filename, content, mime) {
      const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    /* ================= 快递公司字典 ================= */
    const COURIERS = [
      { name: '顺丰速运', prefix: 'SF' },
      { name: '京东物流', prefix: 'JD' },
      { name: '圆通速递', prefix: 'YT' },
      { name: '中通快递', prefix: 'ZTO' },
      { name: '韵达速递', prefix: 'YD' },
      { name: '申通快递', prefix: 'STO' },
      { name: '邮政 EMS', prefix: 'EMS' },
      { name: '极兔速递', prefix: 'JT' },
      { name: '德邦快递', prefix: 'DP' },
      { name: '丹鸟快递', prefix: 'DN' },
      { name: 'FedEx', prefix: 'FX' },
    ];

    function detectCourier(code) {
      const up = String(code || '').toUpperCase();
      for (const c of COURIERS) if (up.startsWith(c.prefix)) return c.name;
      return '';
    }

    /* ================= 单号归一化与校验 ================= */
    // 数字区易混字符表：OCR 常把这些字母认成数字
    const CONFUSIBLE = { O: '0', Q: '0', D: '0', I: '1', L: '1', S: '5', B: '8', Z: '2', G: '6', T: '7', A: '4' };
    const REVERSE_CONFUSIBLE = {};
    Object.keys(CONFUSIBLE).forEach(k => {
      if (!(CONFUSIBLE[k] in REVERSE_CONFUSIBLE)) REVERSE_CONFUSIBLE[CONFUSIBLE[k]] = k;
    });

    // 归一化：全角转半角、去空格/下划线/点、统一大写
    function normalizeCode(raw) {
      let s = String(raw || '').trim();
      s = s.replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
      s = s.replace(/[\s._]/g, '');
      return s.toUpperCase();
    }

    // 校验：长度、必须含数字、字符集、排除连续长字母
    function isValidCode(s, minLen) {
      if (!s || s.length < minLen) return false;
      if (!/\d/.test(s)) return false;
      if (!/^[0-9A-Z\-]+$/.test(s)) return false;
      if (/^[A-Z]{6,}$/.test(s)) return false;
      if (/^-|-$/.test(s)) return false;
      return true;
    }

    /* ================= 前缀纠错 =================
       把 OCR 误识别的公司前缀修正为字典里的标准前缀：
       ZT0-556677 -> ZTO-556677（替换）、Y1T7788990011 -> YT7788990011（多识别了一位数字）、
       270-556677 -> ZTO-556677（前缀整体被认成数字）

       只在「和标准前缀只差一处」时修，且那一处必须确实像被识错，
       避免把正常单号改坏（例如 ZTO 不会被改成 YT）。 */
    function fixCourierPrefix(code) {
      for (const c of COURIERS) {
        const p = c.prefix;
        if (code.length < p.length + 3) continue;      // 前缀后至少要跟几位数字
        if (code.startsWith(p)) return code;           // 已经正确

        // 1) 替换：前缀区只有一位被识错
        const head = code.slice(0, p.length);
        let bad = -1;
        for (let i = 0; i < p.length; i++) {
          if (head[i] !== p[i]) { if (bad !== -1) { bad = -2; break; } bad = i; }
        }
        if (bad >= 0 && isVisuallySimilar(head[bad], p[bad])) {
          const cand = p + code.slice(p.length);
          if (isValidCode(cand, 6)) return cand;
        }

        // 2) 多识别了一位数字：删掉它之后前缀就对上了
        //    例如 Y1T... 删掉 '1' → YT...
        for (let i = 0; i < p.length; i++) {
          if (!/\d/.test(code[i])) continue;            // 只删数字（OCR 常把字母读成数字）
          const cand = code.slice(0, i) + code.slice(i + 1);
          if (cand.startsWith(p) && isValidCode(cand, 6)) return cand;
        }

        // 3) 前缀整体被认成数字（如 ZTO -> 270）：每一位都要「像」对应标准字符
        //    且至少有一位确实不同，才允许整体替换
        if (bad === -2) {
          let allSimilar = true, anyDiff = false;
          for (let i = 0; i < p.length; i++) {
            if (head[i] !== p[i]) anyDiff = true;
            if (!isVisuallySimilar(head[i], p[i])) { allSimilar = false; break; }
          }
          if (allSimilar && anyDiff) {
            const cand = p + code.slice(p.length);
            if (isValidCode(cand, 6)) return cand;
          }
        }
      }
      return code;
    }

    // 判断两个字符是否「容易被 OCR 识错」（双向）
    // 覆盖：数字之间、字母<->数字（O<->0、Z<->2）、形近字母（O<->Q、I<->L）
    function isVisuallySimilar(a, b) {
      if (a === b) return true;
      if (/\d/.test(a) && /\d/.test(b)) return true;   // 数字之间（0<->8、1<->7 之类）
      if (CONFUSIBLE[a] === b) return true;            // 字母 -> 数字（O->0、Z->2、S->5）
      if (CONFUSIBLE[b] === a) return true;            // 数字 -> 字母（0->O、2->Z）
      const NEAR = { O: 'Q', Q: 'O', I: 'L', L: 'I', Z: '7', S: '8', B: '6', G: '0' };
      if (NEAR[a] === b || NEAR[b] === a) return true;
      return false;
    }

    /* ================= 数字区易混字符纠正 =================
       分段处理（按 '-' 切）：
       - 首段：保留开头的公司字母前缀，只把前缀之后「本该是数字」的字母改成数字
       - 含数字的段：整串本该是数字，把易混字母统一成数字
       - 纯字母段：是字母后缀（如 ABCDE），把被认成数字的字符改回字母
       这样 NO-12345-ABCDE 不会被改成 NO-12345-4BCDE。 */
    function fixConfusable(code) {
      return code.split('-').map((seg, i) => {
        if (i === 0) {
          // 首段：保留开头的公司字母前缀，只修前缀之后的字符
          const m = /^([A-Z]+)/.exec(seg);
          const keep = m ? m[0].length : 0;
          let rest = '';
          for (const ch of seg.slice(keep)) rest += (CONFUSIBLE[ch] !== undefined) ? CONFUSIBLE[ch] : ch;
          return seg.slice(0, keep) + rest;
        }
        if (/\d/.test(seg)) {
          // 含数字 → 这一串本该是数字，把易混字母统一成数字
          let out = '';
          for (const ch of seg) out += (CONFUSIBLE[ch] !== undefined) ? CONFUSIBLE[ch] : ch;
          return out;
        }
        // 纯字母段 → 字母后缀，把被认成数字的字符改回字母
        let out = '';
        for (const ch of seg) out += (REVERSE_CONFUSIBLE[ch] !== undefined) ? REVERSE_CONFUSIBLE[ch] : ch;
        return out;
      }).join('-');
    }

    // 完整纠错流水线：先修前缀，再修数字区
    function canonicalize(code) {
      return fixConfusable(fixCourierPrefix(code));
    }

    /* ================= 图像预处理 ================= */
    // 灰度 + 1%/99% 直方图对比度拉伸（"精细"档用）
    function stretchContrast(canvas) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = imgData.data;
      const n = canvas.width * canvas.height;
      const hist = new Uint32Array(256);
      for (let i = 0; i < n; i++) {
        hist[(d[i * 4] * 299 + d[i * 4 + 1] * 587 + d[i * 4 + 2] * 114) / 1000 | 0]++;
      }
      let lo = 0, hi = 255, acc = 0;
      const cut = Math.max(1, Math.floor(n * 0.01));
      for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > cut) { lo = i; break; } }
      acc = 0;
      for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > cut) { hi = i; break; } }
      if (hi <= lo) { lo = 0; hi = 255; }
      const range = Math.max(1, hi - lo);
      const lut = new Uint8Array(256);
      for (let i = 0; i < 256; i++) {
        let v = (i - lo) / range * 255;
        lut[i] = v < 0 ? 0 : (v > 255 ? 255 : v);
      }
      for (let i = 0; i < n; i++) {
        const v = lut[(d[i * 4] * 299 + d[i * 4 + 1] * 587 + d[i * 4 + 2] * 114) / 1000 | 0];
        d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
        d[i * 4 + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    /* ================= OCR 引擎管理 ================= */
    // 带超时的探测：确认某个镜像真的能连上再交给 tesseract 用。
    // 必须探测「具体文件」——目录路径在 npmmirror 是 404、在 unpkg 直接 CORS 报错。
    function probe(url, timeoutMs) {
      return new Promise(resolve => {
        const timer = setTimeout(() => resolve(false), timeoutMs || 8000);
        fetch(url, { method: 'HEAD', mode: 'cors', cache: 'no-store' })
          .then(r => { clearTimeout(timer); resolve(r.ok || r.type === 'opaque'); })
          .catch(() => { clearTimeout(timer); resolve(false); });
      });
    }

    // 从候选列表里挑第一个能连通的具体文件所在的镜像，返回它的 base URL
    async function pickMirror(list, timeoutMs) {
      for (const m of list) {
        if (await probe(m.base + '/' + m.probe, timeoutMs)) return m.base;
      }
      // 全都探测失败（可能 HEAD 被拦但 GET 可以）：返回第一个，让后续流程自然报错
      return list[0].base;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        if (window.Tesseract) { resolve(); return; }
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('OCR 引擎加载失败（' + src + '），请检查网络后刷新页面'));
        document.head.appendChild(s);
      });
    }

    let mirrorCache = null;
    async function getMirrors() {
      if (mirrorCache) return mirrorCache;
      const [lib, core, lang] = await Promise.all([
        pickMirror(MIRRORS.lib, 8000),
        pickMirror(MIRRORS.core, 8000),
        pickMirror(MIRRORS.lang, 8000),
      ]);
      mirrorCache = { lib, core, lang };
      return mirrorCache;
    }

    // 同一个 worker 复用于实时识别；换档位时才重建
    async function ensureWorker(profileKey) {
      const m = await getMirrors();
      await loadScript(m.lib + '/tesseract.min.js');
      if (camWorker && camWorker.__model === profileKey) return camWorker;
      if (camWorker) { try { await camWorker.terminate(); } catch (e) {} camWorker = null; }
      camWorker = await Tesseract.createWorker(LANG_NAME, 1, {
        workerPath: m.lib + '/worker.min.js',
        langPath: m.lang,
        corePath: m.core,
        gzip: true,
        logger: () => {},
      });
      // 页面分割模式 6 = 「假设是统一的一列文本」。
      // 默认的 psm 3（全自动布局分析）在纯色大背景下经常把整张图判成一个块
      // 直接放弃；实测 psm 6 在同样的货架照片上从 8/12 提升到 12/12。
      try { await camWorker.setParameters({ tessedit_pageseg_mode: '6' }); } catch (e) {}
      camWorker.__model = profileKey;
      return camWorker;
    }

    /* ================= 单号提取 ================= */
    // 取向：宁可留着可疑的，也不要漏掉真实的。
    // 所以这里只做「明显不是单号」的排除，凡是像编号的一律保留，
    // 由置信度决定它显示成绿色还是黄色（存疑），而不是直接丢弃。
    function looksLikeToken(s) {
      if (s.length < 2) return false;
      if (!/^[0-9A-Z\-]+$/.test(s)) return false;
      // 必须含数字；或本身是公司前缀（等后段拼接）
      if (/\d/.test(s)) return true;
      return COURIERS.some(c => c.prefix === s);
    }

    function collectCandidates(data) {
      const words = (data && data.words) || [];
      const out = [];
      words.forEach(wd => {
        const raw = (wd.text || '').trim();
        if (!raw) return;
        const b = wd.bbox || null;
        // 只过滤明显是噪点的极小块；阈值放得很低，避免把低置信度的真单号一起丢掉
        if (b) {
          const bw = b.x1 - b.x0, bh = b.y1 - b.y0;
          if (bw * bh < 8) return;
          if (bh < 3 || bw < 4) return;
        }
        const norm = normalizeCode(raw);
        if (!looksLikeToken(norm)) return;
        out.push({
          code: canonicalize(norm),
          raw: norm,
          conf: Math.max(0, Math.min(100, wd.confidence || 0)),
          bbox: b,
        });
      });
      return out;
    }

    // 段 token 是否适合参与行合并：要么是纯公司前缀，要么含数字
    function looksMergeable(code) {
      if (/\d/.test(code)) return true;
      return COURIERS.some(c => c.prefix === code);
    }

    // 合并同一行里被空格拆开的单号：SF 7744 5566 8899 -> SF774455668899
    function mergeLineWords(list) {
      if (list.length < 2) return list;
      const sorted = list.slice().sort((a, b) => {
        const ay = a.bbox ? (a.bbox.y0 + a.bbox.y1) / 2 : 0;
        const by = b.bbox ? (b.bbox.y0 + b.bbox.y1) / 2 : 0;
        if (Math.abs(ay - by) > 6) return ay - by;
        return (a.bbox ? a.bbox.x0 : 0) - (b.bbox ? b.bbox.x0 : 0);
      });
      const merged = [];
      let cur = null;
      const pushCur = () => { if (cur) { merged.push(cur); cur = null; } };

      for (const it of sorted) {
        if (!it.bbox) { pushCur(); merged.push(it); continue; }
        if (!cur) { cur = { ...it }; continue; }

        const midY = (it.bbox.y0 + it.bbox.y1) / 2;
        const curMidY = (cur.bbox.y0 + cur.bbox.y1) / 2;
        const hgt = Math.max(4, Math.max(it.bbox.y1 - it.bbox.y0, cur.bbox.y1 - cur.bbox.y0));
        const sameLine = Math.abs(midY - curMidY) <= Math.max(4, hgt * 0.6);
        const gap = it.bbox.x0 - cur.bbox.x1;
        // 只在「紧挨着」时才拼接（大约一个字符宽）。
        // 这个阈值必须收紧：放宽到 hgt*0.9 时，两个本来独立的编号会被粘成
        // "A-12-9900ZTOO-556677" 这种怪物（实测踩过）。
        const closeEnough = gap <= Math.max(4, hgt * 0.45);
        const candidate = cur.code + it.code;
        const wouldBeValid = candidate.length <= 26 && looksMergeable(cur.code) && looksMergeable(it.code);

        if (sameLine && closeEnough && wouldBeValid) {
          cur = {
            code: candidate,
            raw: cur.raw + it.raw,
            conf: Math.min(cur.conf, it.conf),
            bbox: {
              x0: Math.min(cur.bbox.x0, it.bbox.x0),
              y0: Math.min(cur.bbox.y0, it.bbox.y0),
              x1: Math.max(cur.bbox.x1, it.bbox.x1),
              y1: Math.max(cur.bbox.y1, it.bbox.y1),
            },
          };
        } else {
          pushCur();
          cur = { ...it };
        }
      }
      pushCur();
      return merged;
    }

    /* ================= 我的单号（支持多个） ================= */
    // 用户可以添加多个单号，每个都能触发红色高亮与横幅提示。
    // 输入框里的内容在回车/粘贴时转成标签，不会丢。
    let targets = [];          // 归一化后的单号数组

    function currentTargets() { return targets; }

    // 兼容旧调用：返回目标串（多个时用 '|' 连接，仅供展示/导出）
    function currentTarget() { return targets.join('|'); }

    // 这个 code 命中了「任意一个」目标，返回命中的那个目标；否则返回 ''
    function matchedTarget(code) {
      for (const t of targets) if (isTargetHit(code, t)) return t;
      return '';
    }

    // 命中判定。货架编码形态很多（B2-2-23432、SF1234567890、ZTO-556677…），
    // 用户常常只记得其中一段数字，所以这里做「分段包含」匹配。
    //
    // 关键是防「假命中」：输入完整单号 SF1234567890 时，
    // 识别出的碎片 567890 虽然是它的子串，但只覆盖了尾巴，
    // 这种不该算命中（否则任何碎片都会飘红）。所以要求覆盖率足够高。
    function isTargetHit(code, target) {
      if (!target) return false;
      if (code === target) return true;

      const MIN_SEG = 3;        // 单个段至少 3 位才参与段匹配
      const MIN_SUB = 5;        // 子串匹配至少 5 位
      const MIN_COVER = 0.6;    // 较长目标要求覆盖 60% 以上

      const codeSegs = String(code).split('-');
      const targetSegs = String(target).split('-');

      // 2) 目标正好是识别结果里的一个完整段（23432 ⊂ B2-2-23432）
      if (targetSegs.length === 1 && target.length >= MIN_SEG &&
          codeSegs.length > 1 && codeSegs.includes(target)) return true;

      // 3) 目标是一串完整的连续段，且占识别结果的大部分
      if (targetSegs.length > 1 && target.length >= MIN_SEG &&
          String(code).includes(target) &&
          target.length / String(code).length >= 0.5) return true;

      // 3b) 目标带公司前缀（如 SF1234 找 SF1234567890）：
      //     前缀一致 + 后面数字是连续前缀，就算命中（用户常常只记得前半段）
      const pre = COURIERS.find(c => target.startsWith(c.prefix) && target.length > c.prefix.length);
      if (pre && String(code).startsWith(target)) return true;
      if (pre && String(code).startsWith(pre.prefix) &&
          String(code).includes(target.slice(pre.prefix.length))) return true;

      // 4) 目标作为子串出现在结果里 —— 要求覆盖率够高，避免碎片假命中
      if (target.length >= MIN_SUB && String(code).includes(target) &&
          target.length / String(code).length >= MIN_COVER) return true;

      // 5) 识别结果比目标短（用户多输了几位）—— 允许，但要求也不低
      if (target.length >= 8 && String(target).includes(String(code)) &&
          String(code).length / target.length >= MIN_COVER) return true;

      return false;
    }

    /* ================= 摄像头实时识别 ================= */
    const MIN_LEN = () => Math.max(3, Math.min(20, parseInt(minLenInput.value, 10) || 6));
    // 低于这个置信度就算「存疑」，用黄色框 + 百分比问号提示。
    // 注意：存疑不等于丢弃 —— 结果照常进入列表，只是颜色和标记不同。
    const DUBIOUS_CONF = 60;

    // 把一帧切成若干带重叠的小块。
    //
    // 这里的关键发现（实测得来，很反直觉）：
    //   整图一次识别      -> 并排的两个编号会被并成一个词，输出 "pee"/"TEE" 这种乱码
    //   3x3 切分          -> B2-2-23432 正好被接缝切成两半，反而读不出
    //   4x4 切分          -> B2-2-23432 完整读出，但 SF1234567890 又被切开
    // 也就是说没有任何单一粒度能一次覆盖全部排版。所以这里一次跑多套粒度，
    // 结果取并集 —— 甲粒度切坏的，乙粒度往往正好完整。代价是多几次识别，值得。
    function buildTiles(w, h) {
      const OUT = [];
      const seen = new Set();
      const add = (sx, sy, sw, sh, psm) => {
        sx = Math.max(0, Math.round(sx)); sy = Math.max(0, Math.round(sy));
        sw = Math.round(Math.min(sw, w - sx)); sh = Math.round(Math.min(sh, h - sy));
        if (sw < 40 || sh < 40) return;
        const key = sx + ',' + sy + ',' + sw + ',' + sh;
        if (seen.has(key)) return;
        seen.add(key);
        OUT.push({ sx, sy, sw, sh, psm: psm || '6' });
      };

      const grid = (cols, rows, overlapPct, psm) => {
        const cw = w / cols, chh = h / rows;
        const ox = cw * overlapPct, oy = chh * overlapPct;
        for (let r = 0; r < rows; r++) {
          for (let cc = 0; cc < cols; cc++) {
            add(cc * cw - ox, r * chh - oy, cw + ox * 2, chh + oy * 2, psm);
          }
        }
      };

      // 4x4：小块，能完整容纳单个编号（读 B2-2-23432 靠它）
      grid(4, 4, 0.22, '6');
      // 2x2：块大一些，能容纳较长单号（读 SF1234567890 靠它）
      grid(2, 2, 0.22, '6');
      // 横向条带：兜住「一行被纵向切开」的情况
      add(0, 0, w, h * 0.55, '11');
      add(0, h * 0.45, w, h * 0.55, '11');
      return OUT;
    }

    function camSupported() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    }

    // 把视频帧坐标映射到覆盖层（object-fit: cover 的裁剪换算）并画红框
    function drawBoxes(detections, srcW, srcH) {
      const cw = window.innerWidth, ch = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (camOverlay.width !== Math.round(cw * dpr) || camOverlay.height !== Math.round(ch * dpr)) {
        camOverlay.width = Math.round(cw * dpr);
        camOverlay.height = Math.round(ch * dpr);
      }
      const ctx = camOverlay.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, cw, ch);

      const videoAR = srcW / srcH, wrapAR = cw / ch;
      let scale, offX = 0, offY = 0;
      if (videoAR > wrapAR) {           // 视频更宽 -> 左右裁掉
        scale = ch / srcH;
        offX = (cw - srcW * scale) / 2;
      } else {                          // 视频更高 -> 上下裁掉
        scale = cw / srcW;
        offY = (ch - srcH * scale) / 2;
      }

      // 绘制层去重：数据层保留全部识别结果（宁可认错不可漏），
      // 但同一位置上如果叠了好几个不同的码，画出来会糊成一片。
      // 这里按区域分组：同一块重叠区域只画置信度最高的那个，
      // 靠它标出「这里有个单号」，其余的在结果列表里仍可查。
      const drawList = [];
      const sortedDet = detections.slice().sort((a, b) => {
        // 命中项优先画
        const ha = matchedTarget(a.code) ? 1 : 0, hb = matchedTarget(b.code) ? 1 : 0;
        if (ha !== hb) return hb - ha;
        return b.conf - a.conf;
      });
      sortedDet.forEach(d => {
        if (!d.box) return;
        const overlap = drawList.some(k => {
          const ax = Math.max(d.box.x, k.box.x), ay = Math.max(d.box.y, k.box.y);
          const bx = Math.min(d.box.x + d.box.w, k.box.x + k.box.w);
          const by = Math.min(d.box.y + d.box.h, k.box.y + k.box.h);
          if (bx <= ax || by <= ay) return false;
          const inter = (bx - ax) * (by - ay);
          const minA = Math.min(d.box.w * d.box.h, k.box.w * k.box.h);
          return inter / Math.max(1, minA) > 0.55;
        });
        if (!overlap) drawList.push(d);
      });

      drawList.forEach(d => {
        const x = offX + d.box.x * scale, y = offY + d.box.y * scale;
        const w = d.box.w * scale, h = d.box.h * scale;
        const matched = matchedTarget(d.code);
        const hit = !!matched;
        // 三档语义：
        //   命中我输入的单号 -> 红（最粗、带外发光、带「你的快递」）
        //   低置信度（存疑）  -> 黄（结果照常显示，只提示可信度）
        //   正常              -> 绿
        const doubt = !hit && d.conf < DUBIOUS_CONF;
        const color = hit ? '#ff2d2d' : (doubt ? '#f59e0b' : '#10b981');
        const fill = hit ? 'rgba(239,68,68,0.30)' : (doubt ? 'rgba(245,158,11,0.26)' : 'rgba(5,150,105,0.22)');
        const pad = Math.max(4, h * 0.2);
        const bw = w + pad * 2, bh = h + pad * 2;

        ctx.fillStyle = fill;
        ctx.fillRect(x - pad, y - pad, bw, bh);
        ctx.strokeStyle = color;
        ctx.lineWidth = hit ? 4 : 2.5;
        ctx.strokeRect(x - pad, y - pad, bw, bh);

        // 命中时加一圈外发光
        if (hit) {
          ctx.save();
          ctx.shadowColor = 'rgba(255,45,45,0.9)';
          ctx.shadowBlur = 16;
          ctx.strokeStyle = 'rgba(255,45,45,0.85)';
          ctx.lineWidth = 2;
          ctx.strokeRect(x - pad, y - pad, bw, bh);
          ctx.restore();
        }

        // 单号文字标签 + 可信度百分比（超出画面时往左收，避免被裁掉）
        const pct = Math.round(d.conf) + '%' + (doubt ? '?' : '');
        const label = d.code;
        const fs = hit ? 15 : 13;
        ctx.font = '700 ' + fs + 'px ui-monospace,Menlo,Consolas,monospace';
        const tw = ctx.measureText(label).width;
        ctx.font = '700 11px ui-monospace,Menlo,Consolas,monospace';
        const pw = ctx.measureText(pct).width;
        const th = fs + 9;
        const boxW = tw + pw + 22;
        let lx = x - pad;
        if (lx + boxW > cw - 4) lx = Math.max(4, cw - 4 - boxW);
        if (lx < 4) lx = 4;
        const ty = Math.max(th, y - pad - th - 3);
        ctx.fillStyle = color;
        ctx.fillRect(lx, ty, boxW, th);
        // 可信度底色块（半透明白，突出数字）
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fillRect(lx + tw + 12, ty + 2, pw + 8, th - 4);
        ctx.font = '700 ' + fs + 'px ui-monospace,Menlo,Consolas,monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText(label, lx + 6, ty + fs + 1);
        ctx.font = '700 11px ui-monospace,Menlo,Consolas,monospace';
        ctx.fillText(pct, lx + tw + 16, ty + fs);

        // 命中额外标一个「你的快递」
        if (hit) {
          const badge = '◀ 你的快递';
          ctx.font = '700 12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
          const bw2 = ctx.measureText(badge).width + 12;
          let bx = lx + boxW + 6;
          if (bx + bw2 > cw - 4) bx = Math.max(4, lx - bw2 - 6);   // 右边放不下就放左边
          ctx.fillStyle = '#ff2d2d';
          ctx.fillRect(bx, ty, bw2, th);
          ctx.fillStyle = '#fff';
          ctx.fillText(badge, bx + 6, ty + fs + 1);
        }
      });
    }

    function showBanner(code) {
      foundBanner.innerHTML = '✅ 找到你的快递<small>' + esc(code) + '</small>';
      foundBanner.classList.add('show');
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => foundBanner.classList.remove('show'), 2600);
      // 轻微震动反馈（支持的设备上）
      if (navigator.vibrate) { try { navigator.vibrate([40, 60, 40]); } catch (e) {} }
    }

    // 位置去重：多粒度识别会让同一段文字被读成两个不同的码，画框时就会重叠成一片。
    //
    // ⚠ 重要：这个函数会「丢弃」数据，实测把召回率从 89% 压到 61%，
    // 因为它总保留置信度最高的那个，而最高分的往往是错的变体。
    // 按「宁可认错、不可漏」的原则，数据层不再调用它；
    // 绘制层的去重改在 drawBoxes 内部做（只影响画面，不影响数据）。
    // 保留此函数仅供将来需要「强去重」时使用。
    function dedupeByPosition(list) {
      if (list.length <= 1) return list;
      const boxed = list.filter(d => d.bbox);
      const noBox = list.filter(d => !d.bbox);
      const out = [];
      boxed.sort((a, b) => b.conf - a.conf);
      for (const it of boxed) {
        const overlap = out.some(k => {
          const ax = Math.max(it.bbox.x0, k.bbox.x0), ay = Math.max(it.bbox.y0, k.bbox.y0);
          const bx = Math.min(it.bbox.x1, k.bbox.x1), by = Math.min(it.bbox.y1, k.bbox.y1);
          if (bx <= ax || by <= ay) return false;
          const inter = (bx - ax) * (by - ay);
          const aArea = Math.max(1, (it.bbox.x1 - it.bbox.x0) * (it.bbox.y1 - it.bbox.y0));
          const bArea = Math.max(1, (k.bbox.x1 - k.bbox.x0) * (k.bbox.y1 - k.bbox.y0));
          // 交集占较小框的一半以上就算同一处
          return inter / Math.min(aArea, bArea) > 0.5;
        });
        if (!overlap) out.push(it);
      }
      return out.concat(noBox);
    }

    // 跨块重组：把「因空格被切开、且分散在不同块」的片段拼回完整编号。
    // 例：SF / 7744 / 5566 / 8899 -> SF774455668899
    //
    // 关键设计：拼出来的结果只作为「额外候选」加入，绝不替换原始片段。
    // 原因：拼合有风险 —— 两个本来就独立的编号若挨得近，会被拼成一串垃圾码。
    // 若用它替换原文，真码就会丢（实测召回率从 89% 掉到 67%）。
    // 只增不减，才能既补齐被拆开的号，又不伤到原本正确的号。
    function joinAdjacentFragments(list, minLen) {
      if (list.length < 2) return list;
      const withBox = list.filter(d => d.bbox);
      const noBox = list.filter(d => !d.bbox);
      if (withBox.length < 2) return list;

      const sorted = withBox.slice().sort((a, b) => {
        const ay = (a.bbox.y0 + a.bbox.y1) / 2, by = (b.bbox.y0 + b.bbox.y1) / 2;
        if (Math.abs(ay - by) > 8) return ay - by;
        return a.bbox.x0 - b.bbox.x0;
      });

      const merged = [];          // 只用于产出「拼合候选」
      let cur = null;
      const flush = () => { if (cur) { merged.push(cur); cur = null; } };

      for (const it of sorted) {
        if (!cur) { cur = { ...it }; continue; }
        const curMid = (cur.bbox.y0 + cur.bbox.y1) / 2;
        const itMid = (it.bbox.y0 + it.bbox.y1) / 2;
        const h = Math.max(cur.bbox.y1 - cur.bbox.y0, it.bbox.y1 - it.bbox.y0);
        // 纵向容差必须很严：文字高度的一半以内。
        // 放宽到 0.7 倍时，上下两行的编号会被拼成
        // 「7799123456NO-12345-ABCDE」这种跨行垃圾（实测踩过）。
        const sameLine = Math.abs(curMid - itMid) <= Math.max(4, h * 0.45);
        const gap = it.bbox.x0 - cur.bbox.x1;
        // 间隙很小才拼（约一个字符宽），否则是两个独立编号
        const adjacent = gap >= -(h * 0.4) && gap <= Math.max(5, h * 0.8);
        const joined = cur.code + it.code;
        const okJoin = sameLine && adjacent &&
                       joined.length <= 26 &&
                       looksMergeable(cur.code) && looksMergeable(it.code);

        if (okJoin) {
          cur = {
            code: joined,
            conf: Math.min(cur.conf, it.conf),
            bbox: {
              x0: Math.min(cur.bbox.x0, it.bbox.x0),
              y0: Math.min(cur.bbox.y0, it.bbox.y0),
              x1: Math.max(cur.bbox.x1, it.bbox.x1),
              y1: Math.max(cur.bbox.y1, it.bbox.y1),
            },
          };
        } else {
          flush();
          cur = { ...it };
        }
      }
      flush();

      // 原始片段全部保留；拼合结果中「合法且是新的」才追加
      const out = list.slice();
      merged.forEach(m => {
        if (m.code.length >= minLen &&
            isValidCode(m.code, minLen) &&
            !out.some(o => o.code === m.code)) {
          out.push({ code: m.code, conf: m.conf, bbox: m.bbox, synthesized: true });
        }
      });
      return out;
    }

    // 碎片收敛：完整码和它的碎片同时出现时，丢掉碎片。
    // 例：有 B2-2-23432，就丢掉 23432 / 432；有 ZTO-556677 就丢掉 6677。
    //
    // ⚠ 这个函数是有损的，实测会吃掉 5~10 个百分点召回率（83% -> 76%）。
    // 按「宁可认错、不可漏」的原则，数据层不再调用它；
    // 界面上的重复碎片由 drawBoxes 的绘制层去重解决（不动数据）。
    // 保留此函数仅供将来需要「强收敛」时使用。
    //
    // 判据（当初校准的结论，留作参考）：
    //  - 必须「长度优先」排序，否则低分长碎片会抢先入列并反向吸收真码
    //  - 被吸收方必须是「连续子串」且占 60% 以上（只是缺了头尾几位）
    //  - 拼合候选（synthesized）不得吞掉原生结果
    function collapseFragments(list, target) {
      if (list.length <= 1) return list;
      const sorted = list.slice().sort((a, b) => b.code.length - a.code.length || b.conf - a.conf);
      const keep = [];

      const isFragmentOf = (short, long) => {
        if (!long.includes(short)) return false;
        return short.length / long.length >= 0.6;
      };

      for (const it of sorted) {
        if (matchedTarget(it.code)) { keep.push(it); continue; }
        const absorbed = keep.some(k =>
          k.code !== it.code &&
          k.code.length > it.code.length &&
          isFragmentOf(it.code, k.code) &&
          k.conf >= it.conf - 25 &&
          !k.synthesized
        );
        if (!absorbed) keep.push(it);
      }
      return keep;
    }

    // 拆开「两个编号被误粘在一起」的情况：
    // 例 A-12-990ZTOO-556677 -> 应该拆成 A-12-990 / ZTOO-556677。
    // 手法：在字符串里找第二个公司前缀或明显的重新开始点。
    function splitGlued(code) {
      if (code.length < 14) return [code];
      const parts = [];
      let rest = code;
      let guard = 0;
      while (rest.length >= 5 && guard++ < 6) {
        // 从右侧找一个更短但合法的尾巴（含公司前缀最佳）
        let cut = -1;
        const prefixes = COURIERS.map(c => c.prefix).concat(['A-', 'B-']);
        for (const p of prefixes) {
          const idx = rest.indexOf(p, 1);
          if (idx > 0 && idx < rest.length - 3) { cut = idx; break; }
        }
        if (cut < 0) break;
        parts.push(rest.slice(0, cut));
        rest = rest.slice(cut);
      }
      parts.push(rest);
      // 只有拆出来的每一段都像单号时才采用，否则保持原样
      const good = parts.filter(p => p.length >= 5 && /\d/.test(p));
      return (good.length >= 2 && good.length === parts.length) ? good : [code];
    }

    // 抓一帧 -> 送 OCR -> 画框 -> 累计结果
    async function camTick() {
      if (!camRunning) return;
      if (camBusy) { camRAF = requestAnimationFrame(camTick); return; }
      camBusy = true;
      try {
        const vw = camVideo.videoWidth, vh = camVideo.videoHeight;
        if (vw > 0 && vh > 0 && camWorker) {
          const profile = PROFILES[qualitySel.value] || PROFILES.balanced;
          const scale = Math.min(1, profile.maxSide / Math.max(vw, vh));
          const w = Math.max(1, Math.round(vw * scale)), h = Math.max(1, Math.round(vh * scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.imageSmoothingEnabled = false;       // 最近邻放大，别把字抹糊
          ctx.drawImage(camVideo, 0, 0, w, h);
          if (profile.preprocess) stretchContrast(c);

          // 画面指纹：和上一帧几乎一样就跳过，省 CPU。
          // 但 OCR 有随机性：同一张静止画面，这一帧可能认不出 B2-2-23432，
          // 过几帧再跑一次就可能认出来。所以即使画面没变，也定时强制重跑一次。
          const fp = w + 'x' + h + ':' + (ctx.getImageData(0, 0, Math.min(32, w), Math.min(32, h)).data.join('').slice(0, 240));
          const sameFrame = (fp === camLastShot);
          camLastShot = fp;
          camIdleFrames = sameFrame ? (camIdleFrames + 1) : 0;
          // 画面没变时，每 2 个空闲帧强制重扫一次
          const forceRetry = sameFrame && (camIdleFrames % 2 === 0);
          // 补扫时轮换放大倍数：同样的输入重跑不会有新结果，
          // 换个尺度往往就能把之前漏掉的字读出来。
          const retryBoost = forceRetry ? [1, 1.35, 0.85][camIdleFrames % 3] : 1;
          if (!sameFrame || forceRetry) {
            camScannedFrames++;

            // —— 多区域识别取并集 ——
            // 实测结论（很反直觉，但确实是主因）：
            //   单个格子单独识别 -> B2-2-23432 识别得一字不差
            //   两个格子并排整片识别 -> 变成 "pee" "TEE" 这种乱码
            // 也就是说 tesseract 会在「并排的文字间距不足」时把它们并成一个词然后乱猜。
            // 所以不能整图识别一次了事，必须切成足够小的块，让每块里只有少量文本。
            // 结果是所有块的并集：宁可重复、宁可认错，也绝不因为布局分析而漏掉。
            const tiles = buildTiles(w, h);

            const merged = new Map();   // code -> {conf, bbox(full 坐标系), code}
            for (const rg of tiles) {
              if (rg.sw < 28 || rg.sh < 28) continue;
              // 每块按 2 倍最近邻放大，提升小字可读性（平滑插值会把字抹糊）。
              // 补扫时按 retryBoost 轮换倍数，让每次重试看到略微不同的像素，
              // 这样才可能把上次漏掉的字读出来。
              const up = 2 * retryBoost;
              const tile = document.createElement('canvas');
              tile.width = Math.round(rg.sw * up);
              tile.height = Math.round(rg.sh * up);
              const tctx = tile.getContext('2d', { willReadFrequently: true });
              tctx.imageSmoothingEnabled = false;
              tctx.drawImage(c, rg.sx, rg.sy, rg.sw, rg.sh, 0, 0, tile.width, tile.height);

              let data;
              try {
                await camWorker.setParameters({ tessedit_pageseg_mode: rg.psm });
                ({ data } = await camWorker.recognize(tile));
              } catch (e) {
                continue;   // 单块失败不影响其它块
              }

              const minLen = MIN_LEN();
              let dets = collectCandidates(data);
              dets = mergeLineWords(dets);
              dets = dets.filter(d => isValidCode(d.code, minLen));

              dets.forEach(d => {
                // 把块内坐标换算回整帧坐标（除以本块实际用的放大倍数）
                const bb = d.bbox ? {
                  x0: rg.sx + d.bbox.x0 / up,
                  y0: rg.sy + d.bbox.y0 / up,
                  x1: rg.sx + d.bbox.x1 / up,
                  y1: rg.sy + d.bbox.y1 / up,
                } : null;
                const prev = merged.get(d.code);
                if (!prev) {
                  merged.set(d.code, { code: d.code, conf: d.conf, bbox: bb });
                } else {
                  // 同一单号被多块识别：取最高置信度；都有框时取并集
                  if (d.conf > prev.conf) { prev.conf = d.conf; prev.bbox = bb || prev.bbox; }
                  else if (bb && prev.bbox) {
                    prev.bbox = {
                      x0: Math.min(prev.bbox.x0, bb.x0), y0: Math.min(prev.bbox.y0, bb.y0),
                      x1: Math.max(prev.bbox.x1, bb.x1), y1: Math.max(prev.bbox.y1, bb.y1),
                    };
                  }
                }
              });
            }

            // 恢复整图模式的 psm，供下一帧默认使用
            try { await camWorker.setParameters({ tessedit_pageseg_mode: '6' }); } catch (e) {}

            // —— 碎片收敛 ——
            // 多粒度取并集的副作用：完整码和它的碎片会同时出现
            // （B2-2-23432 / 23432 / 432）。碎片会把界面搞乱、也会干扰命中判断。
            // 规则：如果一个码是另一个更长码的子串，且置信度不更高，就丢掉它。
            // 但用户输入的号码要保留，否则「输入 23432 命中 B2-2-23432」会被吃掉。
            let uniq = Array.from(merged.values());

            // 跨块重组：把「因空格被切开、分散在不同块」的片段拼回完整编号
            // （SF 7744 5566 8899 -> SF774455668899）。
            // 它只「补充」拼合候选，不替换原片段。
            uniq = joinAdjacentFragments(uniq, MIN_LEN());

            // 拆开被误粘在一起的两个编号（A-12-990ZTOO-556677）。
            // 注意：拆分出的片段和原始粘连串都保留，不做取舍。
            const exploded = [];
            uniq.forEach(d => {
              exploded.push(d);
              const parts = splitGlued(d.code);
              if (parts.length > 1) {
                parts.forEach(p => {
                  if (!exploded.some(x => x.code === p)) {
                    exploded.push({ code: p, conf: d.conf, bbox: d.bbox, synthesized: true });
                  }
                });
              }
            });

            // 碎片收敛是「有损」操作，实测会吃掉 5~10 个百分点召回率
            // （83% -> 76%）。按「宁可认错、不可漏」的要求，这里默认不做，
            // 只对用户明确要查的单号做收敛（避免命中项被清掉）。
            // 重复碎片在界面上通过绘制层去重解决，不影响数据完整性。
            uniq = exploded;

            // 换算回视频原始坐标供画框
            uniq.forEach(d => {
              if (d.bbox) {
                d.box = {
                  x: Math.round(d.bbox.x0 / scale),
                  y: Math.round(d.bbox.y0 / scale),
                  w: Math.round((d.bbox.x1 - d.bbox.x0) / scale),
                  h: Math.round((d.bbox.y1 - d.bbox.y0) / scale),
                };
              }
            });

            lastDetections = uniq;
            drawBoxes(uniq, vw, vh);

            // 命中自己的单号 -> 横幅提示。
            // 支持多个目标：每个新命中的单号都弹一次（同一时刻只显示最新那个）。
            const hitCodes = uniq.filter(d => matchedTarget(d.code)).map(d => d.code);
            const freshHit = hitCodes.find(c => !bannerShownCodes.has(c));
            if (freshHit) {
              hitCodes.forEach(c => bannerShownCodes.add(c));
              lastHitCode = freshHit;
              showBanner(freshHit);
            }
            if (!hitCodes.length) bannerShownCodes.clear();

            // 累计到结果列表
            let added = 0;
            uniq.forEach(d => {
              const exist = found.find(r => r.code === d.code);
              if (exist) {
                if (d.conf > exist.conf) { exist.conf = d.conf; }
                return;
              }
              found.push({
                id: 'r' + (++seq),
                code: d.code,
                conf: d.conf,
                courier: detectCourier(d.code),
                at: Date.now(),
              });
              added++;
            });
            if (added) { renderResults(); renderTargets(); }

            camStat.textContent = '已扫 ' + camScannedFrames + ' 帧 · 识别到 ' + found.length + ' 个单号';
          }
        }
      } catch (e) {
        // 单帧失败不中断实时识别
        camStat.textContent = '识别出错：' + (e && e.message ? e.message : e);
      } finally {
        camBusy = false;
      }
      camRAF = requestAnimationFrame(camTick);
    }

    async function camStart() {
      if (!camSupported()) {
        toast('当前浏览器不支持摄像头（需要 HTTPS 或 localhost）');
        return;
      }
      camStartBtn.disabled = true;
      camStat.textContent = '正在准备 OCR 引擎…';
      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1440 },
          },
          audio: false,
        });
        camVideo.srcObject = camStream;
        await camVideo.play();
        camOff.style.display = 'none';
        camStartBtn.style.display = 'none';
        camStopBtn.style.display = '';
        camStat.textContent = '正在加载 OCR 引擎…';

        await ensureWorker(qualitySel.value || 'balanced');
        camRunning = true;
        camLastShot = '';
        camScannedFrames = 0;
        camIdleFrames = 0;
        lastHitCode = '';
        camStat.textContent = '实时识别中…';
        camRAF = requestAnimationFrame(camTick);
      } catch (e) {
        camStop();
        const msg = /Permission|NotAllowed/i.test(e.name || '')
          ? '摄像头权限被拒绝，请在地址栏允许后重试'
          : (e && e.message ? e.message : String(e));
        toast('无法开启摄像头：' + msg);
        camStat.textContent = '';
      } finally {
        camStartBtn.disabled = false;
      }
    }

    function camStop() {
      camRunning = false;
      if (camRAF) { cancelAnimationFrame(camRAF); camRAF = 0; }
      if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
      camVideo.srcObject = null;
      camBusy = false;
      camLastShot = '';
      lastHitCode = '';
      lastDetections = [];
      const ctx = camOverlay.getContext('2d');
      if (ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, camOverlay.width, camOverlay.height); }
      camOff.style.display = '';
      camStartBtn.style.display = '';
      camStopBtn.style.display = 'none';
      foundBanner.classList.remove('show');
    }

    /* ================= 结果列表 ================= */
    // 外层：刷新结果 + 标签状态（标签的绿点依赖结果，所以两者要一起更新）
    function renderResults() {
      renderResultsBody();
      if (typeof renderTargets === 'function') renderTargets();
    }

    // 内层：只画列表本身，不再回头调用 renderResults，避免递归
    function renderResultsBody() {
      resCount.textContent = found.length;
      sheetStat.textContent = found.length ? (found.length + ' 个') : '';

      if (!found.length) {
        resultGrid.innerHTML = '<div class="empty-tip">把镜头对准快递单号，识别到的号码会出现在这里。</div>';
        return;
      }

      // 命中的排前面
      const list = found.slice().sort((a, b) => {
        const ha = matchedTarget(a.code) ? 1 : 0;
        const hb = matchedTarget(b.code) ? 1 : 0;
        if (ha !== hb) return hb - ha;
        return b.at - a.at;
      });

      resultGrid.innerHTML = '';
      list.forEach(r => {
        const hit = !!matchedTarget(r.code);
        const doubt = !hit && r.conf < DUBIOUS_CONF;
        const item = document.createElement('div');
        item.className = 'res-item' + (hit ? ' is-target' : (doubt ? ' is-doubt' : ''));
        item.innerHTML =
          '<div class="res-main">' +
            '<div class="res-code">' + esc(r.code) + '</div>' +
            '<div class="res-meta">' +
              (hit ? '<span class="tag hit">你的快递</span>' : '') +
              (doubt ? '<span class="tag doubt">存疑</span>' : '') +
              (r.courier ? '<span class="tag">' + esc(r.courier) + '</span>' : '') +
              '可信度 ' + Math.round(r.conf) + '%' +
            '</div>' +
          '</div>' +
          '<div class="res-act">' +
            '<button data-act="copy">复制</button>' +
            '<button data-act="edit">改</button>' +
            '<button data-act="del" class="del">删除</button>' +
          '</div>';
        resultGrid.appendChild(item);

        item.querySelector('[data-act="copy"]').addEventListener('click', async () => {
          toast(await copyText(r.code) ? '已复制 ' + r.code : '复制失败，请手动选择');
        });
        item.querySelector('[data-act="edit"]').addEventListener('click', () => {
          const next = window.prompt('修正这个单号（识别可能有误）：', r.code);
          if (next == null) return;
          const norm = normalizeCode(next);
          if (!norm) { toast('不能为空'); return; }
          r.code = norm;
          r.edited = true;
          r.courier = detectCourier(norm);
          renderResults();
          redrawFromLastFrame();
          toast('已改为 ' + norm);
        });
        item.querySelector('[data-act="del"]').addEventListener('click', () => {
          found = found.filter(x => x.id !== r.id);
          renderResults();
        });
      });
    }

    /* ================= 抽屉与设置 ================= */
    sheetToggle.addEventListener('click', () => sheet.classList.toggle('open'));
    // 点抽屉顶部的手柄/标题也能收起
    sheet.querySelector('.sheet-head').addEventListener('click', () => sheet.classList.remove('open'));

    settingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
    settingsClose.addEventListener('click', () => settingsPanel.classList.remove('open'));
    settingsPanel.addEventListener('click', e => {
      if (e.target === settingsPanel) settingsPanel.classList.remove('open');
    });

    // 换档位时丢弃缓存的 worker，实时识别会立即用新档位重建
    qualitySel.addEventListener('change', async () => {
      const wasRunning = camRunning;
      if (camWorker) { try { await camWorker.terminate(); } catch (e) {} camWorker = null; }
      if (wasRunning) {
        camStat.textContent = '正在切换档位…';
        try {
          await ensureWorker(qualitySel.value || 'balanced');
          camStat.textContent = '实时识别中…';
        } catch (e) {
          camStat.textContent = '切换失败：' + (e && e.message ? e.message : e);
        }
      }
    });

    /* ================= 我的单号：多标签管理 ================= */
    // 支持：
    //   - 点「添加」按钮（手机主要靠这个）/ 回车 / 逗号 添加
    //   - 直接粘贴一大段（换行、逗号、空格混合）批量添加
    //   - 点标签上的 × 单独删除；空输入框按退格删最后一个
    const MAX_TARGETS = 30;

    function renderTargets() {
      targetChips.innerHTML = '';
      targets.forEach((t, i) => {
        const chip = document.createElement('span');
        const isFound = found.some(r => isTargetHit(r.code, t));
        chip.className = 'tchip' + (isFound ? ' found' : '');
        chip.innerHTML =
          (isFound ? '<span class="ok">✓</span>' : '') +
          '<span>' + esc(t) + '</span>' +
          '<button class="x" data-i="' + i + '" title="移除">×</button>';
        chip.querySelector('.x').addEventListener('click', ev => {
          ev.stopPropagation();
          targets.splice(i, 1);
          bannerShownCodes.clear();
          renderTargets();
          renderResultsBody();
          redrawFromLastFrame();
        });
        targetChips.appendChild(chip);
      });
      targetInput.placeholder = targets.length
        ? '继续添加…'
        : '输入单号后回车，可添加多个';
    }

    // 把一段文本拆成若干单号并加入列表
    function addTargetsFromText(text) {
      const parts = String(text || '')
        .split(/[\s,;，；、|\/]+/)
        .map(s => normalizeCode(s))
        .filter(Boolean);
      let added = 0;
      parts.forEach(p => {
        if (targets.length >= MAX_TARGETS) return;
        if (!targets.includes(p)) { targets.push(p); added++; }
      });
      if (added) {
        bannerShownCodes.clear();
        renderTargets();
        renderResults();
        redrawFromLastFrame();
        toast('已添加 ' + added + ' 个单号（共 ' + targets.length + ' 个）');
      }
      return added;
    }

    // 输入时实时同步（不生成标签，只为了即时预览高亮）
    targetInput.addEventListener('input', () => {
      updateAddBtn();
      renderResults();
      redrawFromLastFrame();
    });

    // 「添加」按钮：手机上没有可靠的回车键，主要靠它
    const targetAdd = $('targetAdd');
    function updateAddBtn() {
      const v = targetInput.value.trim();
      targetAdd.disabled = !v;
      // 输入框里已经有内容时，按钮变醒目
      targetAdd.textContent = v ? '添加' : '添加';
    }
    targetAdd.addEventListener('click', () => {
      const v = targetInput.value.trim();
      if (!v) {
        toast('先输入单号');
        targetInput.focus();
        return;
      }
      // 先把输入框清空，再添加：addTargetsFromText 内部会重建标签 DOM，
      // 若放在后面清，重建过程可能把值又带回输入框（实测踩过）。
      targetInput.value = '';
      addTargetsFromText(v);
      updateAddBtn();
      // 手机上收起键盘，让用户看清货架
      targetInput.blur();
    });

    targetInput.addEventListener('keydown', e => {
      // 用输入法组词时的回车不要拦截
      if (e.isComposing) return;
      if (e.key === 'Enter' || e.key === ',' || e.key === ';') {
        e.preventDefault();
        const v = targetInput.value.trim();
        if (!v) { targetInput.blur(); return; }
        targetInput.value = '';        // 先清空，理由同上
        addTargetsFromText(v);
        updateAddBtn();
      } else if (e.key === 'Backspace' && !targetInput.value && targets.length) {
        // 空输入框按退格 = 删掉最后一个标签
        targets.pop();
        renderTargets();
        renderResults();
        redrawFromLastFrame();
        updateAddBtn();
      }
    });

    // 粘贴一段（可能带换行/逗号）时批量添加
    targetInput.addEventListener('paste', e => {
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      if (txt && /[\s,;，；]/.test(txt.trim())) {
        e.preventDefault();
        addTargetsFromText(txt);
        targetInput.value = '';
      }
    });

    /* ================= 结果操作 ================= */
    copyAllBtn.addEventListener('click', async () => {
      if (!found.length) { toast('还没有结果'); return; }
      const text = found.map(r => r.code).join('\n');
      toast(await copyText(text) ? '已复制 ' + found.length + ' 个单号' : '复制失败');
    });

    exportCsvBtn.addEventListener('click', () => {
      if (!found.length) { toast('还没有结果'); return; }
      const rows = [['单号', '置信度', '快递公司', '命中的我的单号', '识别时间']];
      found.forEach(r => {
        rows.push([r.code, Math.round(r.conf), r.courier || '',
          matchedTarget(r.code) || '',
          new Date(r.at).toLocaleString('zh-CN')]);
      });
      const csv = '\uFEFF' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      download('快递单号-' + new Date().toISOString().slice(0, 10) + '.csv', csv, 'text/csv;charset=utf-8');
      toast('已导出 CSV');
    });

    exportJsonBtn.addEventListener('click', () => {
      if (!found.length) { toast('还没有结果'); return; }
      const payload = found.map(r => ({
        code: r.code,
        confidence: Math.round(r.conf),
        courier: r.courier || null,
        isMyNumber: !!matchedTarget(r.code),
        matchedMyNumber: matchedTarget(r.code) || null,
        scannedAt: new Date(r.at).toISOString(),
        source: '摄像头',
      }));
      download('快递单号-' + new Date().toISOString().slice(0, 10) + '.json',
        JSON.stringify({
          exportedAt: new Date().toISOString(),
          myNumbers: targets.slice(),
          count: payload.length,
          items: payload,
        }, null, 2),
        'application/json');
      toast('已导出 JSON');
    });

    clearResultsBtn.addEventListener('click', () => {
      found = [];
      lastHitCode = '';
      renderResults();
      toast('已清空结果');
    });

    /* ================= 事件绑定 & 初始化 ================= */
    camStartBtn.addEventListener('click', camStart);
    camStopBtn.addEventListener('click', () => { camStop(); camStat.textContent = '已停止'; });

    // 页面尺寸变化时重画（全屏/旋转）
    window.addEventListener('resize', () => {
      if (!camRunning) {
        const ctx = camOverlay.getContext('2d');
        if (ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, camOverlay.width, camOverlay.height); }
      }
    });

    // 切到后台就暂停识别，回来再继续，省电
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && camRunning) {
        camRunning = false;
        if (camRAF) { cancelAnimationFrame(camRAF); camRAF = 0; }
      } else if (!document.hidden && camStream && !camRunning) {
        camRunning = true;
        camLastShot = '';
        camRAF = requestAnimationFrame(camTick);
      }
    });

    // 离开页面时关摄像头，别把指示灯留着
    window.addEventListener('beforeunload', () => camStop());

    // 手机键盘弹出时，可视高度会明显变小；用它来判断并把输入区上移
    if (window.visualViewport) {
      const vv = window.visualViewport;
      const onVV = () => {
        const shrunk = vv.height < window.innerHeight * 0.75;
        document.body.classList.toggle('keyboard-open', shrunk);
      };
      vv.addEventListener('resize', onVV);
      vv.addEventListener('scroll', onVV);
      onVV();
    }
    targetInput.addEventListener('focus', () => {
      if (window.innerWidth <= 560) document.body.classList.add('keyboard-open');
    });
    targetInput.addEventListener('blur', () => {
      document.body.classList.remove('keyboard-open');
    });

    // 初始化
    updateAddBtn();
    renderTargets();
    renderResults();
  </script>
  <script src="../assets/js/baidu-analytics.js"></script>
</body>
</html>
