  <style>
    /* ===== 运动小人（纯 SVG） ===== */
    .tool-hero {
      padding: 56px 0 24px;
      text-align: center;
    }

    .tool-hero h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    /* ---- 动作选择 ---- */
    .ex-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .ex-tab {
      padding: 8px 18px;
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid rgba(37, 99, 235, 0.25);
      background: rgba(255, 255, 255, 0.55);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
    }

    .ex-tab:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .ex-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ---- 舞台 ---- */
    .stage-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      margin: 0 auto 16px;
      max-width: 620px;          /* 舞台不随窗口无限放大，保证控制区留在首屏 */
      background: linear-gradient(180deg, #ffffff 0%, #eef3ff 76%, #e4ecfb 100%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 30px rgba(31, 35, 40, 0.08);
    }

    .stage-wrap svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .stage-badge {
      position: absolute;
      top: 12px;
      left: 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(37, 99, 235, 0.18);
      border-radius: 999px;
      padding: 3px 14px;
      pointer-events: none;
    }

    .stage-view {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(100, 116, 139, 0.18);
      border-radius: 999px;
      padding: 3px 12px;
      pointer-events: none;
    }

    /* ---- 人物 ---- */
    #shadow {
      fill: rgba(31, 35, 40, 0.13);
    }

    /* 形体：浅色背景（舞台顶部是纯白）上必须有深色轮廓才立得住。
       每个部件是实心胶囊/圆形（有粗细变化），外圈统一的深蓝轮廓
       由 #figOut 滤镜生成 —— 见 SVG 里的 <defs>。 */
    .seg {
      stroke: #2563eb;
      stroke-linecap: round;
      fill: none;
    }

    .solid {
      fill: #2563eb;
      stroke: none;
    }

    /* 侧面视角的远侧肢体用浅灰，表达前后层次 */
    .far {
      stroke: #c3cddd;
    }

    .solid.far {
      fill: #c3cddd;
    }

    /* 正面视角：左右两侧同等可见、并不存在「一前一后」的遮挡关系，
       因此不再区分远近，整个人物统一用主色。
       只有侧面视角（仰卧起坐 / 俯卧撑）才保留远侧浅灰。 */
    #scene.front .far {
      stroke: #2563eb;
    }

    #scene.front .solid.far {
      fill: #2563eb;
    }

    /* ---- 控制区 ---- */
    .ctrl-card {
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 14px;
    }

    .ctrl-row:last-child {
      margin-bottom: 0;
    }

    .ctrl-row > label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      flex-shrink: 0;
    }

    .ctrl-row input[type="range"] {
      flex: 1 1 200px;
      min-width: 150px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .val {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      min-width: 116px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .preset {
      padding: 5px 11px;
      font-size: 0.78rem;
      font-family: inherit;
      border-radius: 999px;
      border: 1px solid rgba(37, 99, 235, 0.25);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      transition: background 0.15s;
    }

    .preset:hover {
      background: rgba(37, 99, 235, 0.1);
    }

    /* 镜面反转开关（仅侧面视角可用） */
    .switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      padding: 5px 14px;
      border-radius: 999px;
      border: 1px solid rgba(37, 99, 235, 0.25);
      background: rgba(255, 255, 255, 0.5);

    .switch:hover {

    .switch.on {
      background: rgba(37, 99, 235, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    .switch input {
      accent-color: var(--accent);
      cursor: pointer;
      margin: 0;
    }

    .switch.hidden {
      display: none;
    }

    .tip {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 40px;
      line-height: 1.95;
    }

    @media (max-width: 640px) {

        font-size: 0.78rem;
      }

      .ex-tab {
        padding: 7px 13px;
        font-size: 0.84rem;
      }
    }

    <section class="tool-hero">
      <h1>运动<span class="accent">小人</span></h1>
      <p class="muted">纯 SVG 火柴人，关节角度逐帧计算，速度最高 30 倍。</p>
    </section>

    <div class="ex-tabs" id="exTabs"></div>

    <div class="stage-wrap">
      <span class="stage-badge" id="stageBadge">高抬腿</span>
      <span class="stage-view" id="stageView">正面视角</span>
      <svg viewBox="0 0 420 440" role="img" aria-labelledby="figTitle figDesc">
        <title id="figTitle">运动小人</title>
        <desc id="figDesc">用线条绘制的火柴人正在做运动，关节角度由 JavaScript 实时计算。</desc>

        <defs>
          <!-- 统一的形体轮廓：把整个人物的不透明区域向外扩张一圈、填成深蓝，再叠回原图。
               挂在 #figure 上，扩张的是整体的合并轮廓，因此：
                 · 肢体与躯干的连接处天然融为一体，没有任何接缝或被「切断」的痕迹；
                 · 只有【手】例外 —— 它单独画在这个滤镜之外并自带描边，
                   这样手伸到身体前面时能看到手的轮廓。 -->
          <filter id="figOut" x="-25%" y="-25%" width="150%" height="150%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="2.6" result="dil"></feMorphology>
            <feFlood flood-color="#1e3a8a" result="col"></feFlood>
            <feComposite in="col" in2="dil" operator="in" result="ring"></feComposite>
            <feMerge>
              <feMergeNode in="ring"></feMergeNode>
              <feMergeNode in="SourceGraphic"></feMergeNode>
            </feMerge>
          </filter>
        </defs>

        <!-- 整体包在一个组里：镜面反转直接翻转这个组，保证所有部件一致 -->
        <g id="scene">
          <!-- 地面与阴影 -->
          <ellipse id="shadow" cx="210" cy="391" rx="56" ry="9"></ellipse>
          <line x1="0" y1="386" x2="420" y2="386" stroke="#c8d2e4" stroke-width="3"></line>

          <!-- ===== 人物：拆成 5 个组，正面视角每帧按深度重新排序 =====
               这样「朝镜头抬起」的腿会画在躯干之上（抬在身前），
               而不是压在躯干之下（那会被看成人站在背面）。
               每个部件是「有粗细变化」的实心形体（不是等宽线条），
               四肢由若干段不同粗细的圆头胶囊拼成，
               外圈轮廓由挂在 #figure 上的 figOut 滤镜统一生成。 -->
          <g id="figure" filter="url(#figOut)">
            <g id="grpFarLeg">
              <line id="farLegUpper" class="seg far"></line>
              <line id="farLegLower" class="seg far"></line>
              <ellipse id="farFoot" class="solid far"></ellipse>
              <line id="farFootSide" class="seg far"></line>
            </g>
            <g id="grpFarArm">
              <line id="farArmUpper" class="seg far"></line>
              <line id="farArmLower" class="seg far"></line>
            </g>

            <!-- 眼睛放在 filter 组【之外】：否则它们的 alpha 也会被一起扩张，
                 在蓝脸上糊出一圈深蓝，看起来像戴了墨镜。 -->
            <g id="grpTorso">
              <line id="spine2" class="seg near"></line>
              <line id="spine" class="seg near"></line>
              <line id="neckLine" class="seg near"></line>
              <line id="shoulders" class="seg near"></line>
              <ellipse id="head" cx="0" cy="0" rx="9.5" ry="12.5" class="solid near"></ellipse>
            </g>

            <g id="grpNearLeg">
              <line id="nearLegUpper" class="seg near"></line>
              <line id="nearLegLower" class="seg near"></line>
              <ellipse id="nearFoot" class="solid near"></ellipse>
              <line id="nearFootSide" class="seg near"></line>
            </g>
            <g id="grpNearArm">
              <line id="nearArmUpper" class="seg near"></line>
              <line id="nearArmLower" class="seg near"></line>
            </g>
          </g>

          <!-- 五官必须始终画在最上层：正面视角位于头内，侧面视角位于头前缘。
               眼睛和嘴巴都放在这里（而不是头所在的 grpTorso 里），
               否则它们会被统一轮廓滤镜一起扩张、在蓝脸上糊成一圈深蓝。 -->
          <g id="grpFace">
            <circle id="face" cx="0" cy="0" r="4" fill="#ffffff"></circle>
            <circle id="face2" cx="0" cy="0" r="4" fill="#ffffff"></circle>
            <path id="mouth" d="" fill="none" stroke="#ffffff" stroke-width="3"
                  stroke-linecap="round"></path>
          </g>
          </g>
        </g>
      </svg>

  <script>
  (function () {
    'use strict';

    // ============================================================
    // 1. 数学工具
    //    内部使用「数学坐标系」：x 向右，y 向上。
    //    侧面视角用 2D 角度描述（90° = 正上方，270° = 正下方）；
    //    正面视角用 3D 方向 + 正交投影描述（见第 4 节）。
    //    写入 DOM 时统一翻转 y 轴。
    // ============================================================
    var DEG = Math.PI / 180;

    function dirOf(deg) { return { x: Math.cos(deg * DEG), y: Math.sin(deg * DEG) }; }
    function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
    function mul(a, k) { return { x: a.x * k, y: a.y * k }; }
    function walk(p, deg, len) {
      return { x: p.x + Math.cos(deg * DEG) * len, y: p.y + Math.sin(deg * DEG) * len };
    }
    function lerpP(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
    function smoothstep(t) { return t * t * (3 - 2 * t); }

    // 每个半周期做一次「起 → 停 → 回」的钟形往返：端点是驻留的，不是三角波
    function pulse(u) { return smoothstep(0.5 - 0.5 * Math.cos(Math.PI * 2 * u)); }

    // 两段式 IK：已知根、末端与两段长度，求中间关节（bend 决定弯曲朝向）
    function ik2(root, target, l1, l2, bend) {
      var dx = target.x - root.x, dy = target.y - root.y;
      var raw = Math.sqrt(dx * dx + dy * dy) || 1;
      var ux = dx / raw, uy = dy / raw;
      var d = clamp(raw, Math.abs(l1 - l2) + 0.01, l1 + l2 - 0.01);
      var x = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
      var h = Math.sqrt(Math.max(0, l1 * l1 - x * x));
      var px = -uy, py = ux;
      return {
        mid: { x: root.x + ux * x + px * h * bend, y: root.y + uy * x + py * h * bend },
        end: { x: root.x + ux * d, y: root.y + uy * d }
      };
    }

    // ============================================================
    // 2. 骨架尺寸与线条粗细
    // ============================================================
    // ---- 骨架尺寸 ----
    // 整体按参考图的「8 头身」写实比例重新标定（a = 头高 = 25 单位）：
    //   头 1a ／ 下巴到肩 0.5a ／ 肩到胯 2.5a ／ 胯到脚底 4a  合计 8a
    // 关键变化（旧比例是 5 头身的 Q 版）：头明显变小、腿占全身一半。
    var HEAD_A = 25;                 // a：头高（= 头纵向直径）
    var L = {
      neck: 78,        // 骨盆中心 → 颈（躯干顶端）
      head: 13,        // 颈 → 头中心
      headR: 12.5,     // 头【纵向】半径（= 0.5a）
      headRx: 9.5,     // 头【横向】半径：比纵向小 → 头是细长的，不是正圆
      chest: 0.80,     // 肩关节在躯干上的位置比例（肩要靠近躯干顶端）
      thigh: 52,
      shin: 42,
      ankleH: 6,       // 踝关节 → 脚掌中心线
      footFwd: 16,     // 脚尖向前
      footBack: 7,     // 脚跟向后
      upperArm: 46,
      foreArm: 38,
      shoulderW: 22,   // 半肩宽（参考图肩宽 2a）
      hipW: 13
    };

    var R = { torso: 13, arm: 8.5, leg: 10.5, foot: 7 };

    // ------------------------------------------------------------
    // 体形：各部位的「半宽」（局部坐标单位）。
    // 肢体由不同粗细的圆头胶囊分段拼成，因此有真实的粗细变化，
    // 不是从头到尾一样粗的火柴棍。
    // 改成 8 头身后整体收细了一点：写实比例下四肢相对更修长，
    // 若沿用 Q 版的粗细会比躯干还胖。
    // ------------------------------------------------------------
    var BODY = {
      torsoChest: 13,     // 胸腔半宽（躯干最宽处，须窄于肩线，否则躯干像个方盒子）
      torsoWaist: 9,      // 腰部半宽（略收，形成腰线）
      neckW: 4.5,         // 脖颈半宽（细，托住头）
      shoulder: 8,        // 肩线半宽
      thigh: 8.5,         // 大腿半宽
      shin: 5.5,          // 小腿半宽
      footW: 5.5,         // 脚半宽（正面视角：脚的宽度）
      footH: 3.2,         // 脚半高（正面视角：脚背露出的一点点高度）
      upperArm: 5.5,      // 上臂半宽
      foreArm: 4          // 前臂半宽
    };

    // 统一轮廓的扩张半径：与 SVG filter 里的 feMorphology radius 一致。
    // 手的描边宽度也用它，保证两者粗细完全相同。
    var OUTLINE = 2.6;
    var OUTLINE_HALF = OUTLINE;

    function norm2(x, y) {
      var m = Math.sqrt(x * x + y * y) || 1;
      return { x: x / m, y: y / m };
    }

    // 侧视图中：R = 远侧（后画），L = 近侧（前画）。正面视角沿用同一套左右命名。
    var FAR = 'R', NEAR = 'L';

    // ============================================================
    // 3. 两套姿势参数格式
    //    侧面视角（side）：2D 角度
    //      legs[s] = { thigh, knee(内角,180=直), foot(脚掌朝向,0=水平向前) }
    //      arms[s] = { upper, elbow(内角) } 或 { ik:{depth,bend} }
    //      torso: 0=直立，90=头朝后躺平，-90=头朝前趴平
    //    正面视角（front）：3D 方向 + 正交投影，自动产生透视缩短
    //      legs[s] = { abd(外展,+=向画面右侧), flex(前屈,+=朝观察者抬起), knee, splay(脚尖外八) }
    //      arms[s] = { abd, flex, elbow }
    //      lean: 躯干左右侧倾，pitch: 躯干前倾
    // ============================================================

    function sLeg(thigh, knee, foot) { return { thigh: thigh, knee: knee, foot: foot || 0 }; }
    function sArm(upper, elbow) { return { upper: upper, elbow: elbow }; }
    // 侧视「抱头」：把手锁定在【躯干局部坐标】下的 (along, across)。
    // along 沿「骨盆→颈」方向为正；取负值表示落在头的后方/下方（后脑）。
    // across 为垂直躯干方向的侧向偏移。
    // 关键：必须用躯干局部坐标而不是世界 x/y ——
    // 仰卧起坐躯干会从躺平转到坐直（转过近 90°），
    // 固定的世界坐标偏移在躺平时会跑到脚下，只有坐起时才回到头上。
    function sArmHand(along, across, bend) {
      return { hand: { along: along, across: across || 0, bend: bend || -1 } };
    }
    function fLeg(abd, flex, knee, splay, shinAbd) {
      // shinAbd 省略时小腿沿用大腿的外展角。

        // 前臂的外展角可与上臂不同：开合跳靠它把小臂从头顶外侧折回中间，
        // 和两条上臂围成一个圆；不给 foreAbd 时沿用上臂（手臂保持一根直棍）。
        var foreAbd = (m.foreAbd === undefined) ? m.abd : m.foreAbd;
        var foreDir = to3(limbDir3(foreAbd, foreFlex));
        var wristJ = along3(elbowJ, foreDir, L.foreArm);
        fig.arms[sd.k] = { shoulder: sh, elbow: elbowJ, wrist: wristJ };
      });

      return fig;
    }

    // ============================================================
    // 5. 侧面视角求解（局部坐标：骨盆在原点，y 向上，地面在 y = 0）
    // ============================================================
    function buildSide(ex, u, param) {
      var p = ex.pose(u, param);
      var D = 90 + p.torso;                    // 躯干向上的世界方向
      var pelvis = { x: 0, y: 0 };
      var neck = walk(pelvis, D, L.neck);
      var headC = walk(neck, D + p.head, L.head);
      var chest = lerpP(pelvis, neck, L.chest);
      var round = ex.footStyle === 'round';    // 正视时脚画成一个圆点

      var fig = {
        pelvis: pelvis, neck: neck, head: headC, chest: chest,
        headR: L.headR, angles: p, legs: {}, arms: {}
      };

      var sides = [{ k: 'far', s: FAR, sign: -1 }, { k: 'near', s: NEAR, sign: 1 }];

      sides.forEach(function (sd) {
        var g = p.legs[sd.s];
        var hipJ = { x: pelvis.x, y: pelvis.y };
        var shinW = g.thigh - (180 - g.knee);
        var kneeJ = walk(hipJ, g.thigh, L.thigh);
        var ankleJ = walk(kneeJ, shinW, L.shin);

        var f = dirOf(g.foot), fdown = dirOf(g.foot - 90);
        var sole = add(ankleJ, mul(fdown, L.ankleH));
        var heel = round ? sole : add(sole, mul(f, -L.footBack));
        var toe = round ? sole : add(sole, mul(f, L.footFwd));

        fig.legs[sd.k] = {
          hip: hipJ, knee: kneeJ, ankle: ankleJ,
          heel: heel, toe: toe, foot: g.foot
        };
      });

      sides.forEach(function (sd) {
        var m = p.arms[sd.s];
        var sh = { x: chest.x, y: chest.y };
        if (m.ik) {
          var hand = { x: sh.x, y: sh.y - m.ik.depth };
          var res = ik2(sh, hand, L.upperArm, L.foreArm, m.ik.bend);
          fig.arms[sd.k] = { shoulder: sh, elbow: res.mid, wrist: res.end };
        } else if (m.hand) {
          // 把「手」锁在头附近的指定位置。
          // 偏移量必须按【躯干自身的坐标系】来算，不能用世界 x/y：
          // 仰卧起坐时躯干会从躺平转到坐直（转过近 90°），
          // 固定的世界坐标偏移在躺平时会跑到脚下、坐起时才回到头上。
          // along = 沿躯干方向（背离头 = 往后），across = 垂直躯干（侧向）。
          // 抱头：手落在头的后下方（沿躯干方向为负），肘部自然向外张开。
          var uD = D;                                        // 骨盆→颈 方向
          var px = -Math.cos(uD * Math.PI / 180), py = Math.sin(uD * Math.PI / 180);
          var qx = -py, qy = px;
          var tgt = {
            x: headC.x + px * m.hand.along + qx * m.hand.across,
            y: headC.y + py * m.hand.along + qy * m.hand.across
          };
          var r = ik2(sh, tgt, L.upperArm, L.foreArm, m.hand.bend);
          fig.arms[sd.k] = { shoulder: sh, elbow: r.mid, wrist: r.end };
        } else {
          var elbowJ = walk(sh, m.upper, L.upperArm);
          var wristJ = walk(elbowJ, m.upper + (180 - m.elbow), L.foreArm);
          fig.arms[sd.k] = { shoulder: sh, elbow: elbowJ, wrist: wristJ };
        }
      });

      return fig;
    }

    function buildPose(ex, u, param) {
      return ex.view === 'front' ? buildFront(ex, u, param) : buildSide(ex, u, param);
    }

    // ============================================================
    // 6. 轮廓、落地吸附与取景
    // ============================================================
    // 各部件「轮廓最低点」（数学坐标，越小人越低）
    // 轮廓半宽直接取自 BODY 表，保证吸附/取景与真实画出来的形体一致。
    var RW = {
      torso: Math.max(BODY.torsoChest, BODY.torsoWaist, L.shoulderW + BODY.shoulder),
      leg: BODY.thigh,                 // 大腿最粗
      arm: BODY.upperArm,              // 上臂最粗
      foot: BODY.footW
    };

    function polyBottom(pts, r) {
      var m = Infinity;
      for (var i = 0; i < pts.length; i++) if (pts[i].y < m) m = pts[i].y;
      return m - r;
    }

    function bottoms(fig) {
      var b = {
        torso: polyBottom([fig.pelvis, fig.neck], RW.torso),
        head: fig.head.y - fig.headR
      };
      ['far', 'near'].forEach(function (k) {
        var g = fig.legs[k], a = fig.arms[k];
        b['leg' + cap(k)] = polyBottom([g.hip, g.knee, g.ankle], RW.leg);
        b['foot' + cap(k)] = polyBottom([g.heel, g.toe], RW.foot);
        b['arm' + cap(k)] = polyBottom([a.shoulder, a.elbow, a.wrist], RW.arm);
      });
      return b;
    }

    function cap(k) { return k.charAt(0).toUpperCase() + k.slice(1); }

    function lowestOf(b, keys) {
      var m = Infinity;
      keys.forEach(function (k) { if (b[k] < m) m = b[k]; });
      return m;
    }

    var ALL_PARTS = ['torso', 'head', 'legFar', 'legNear', 'footFar', 'footNear', 'armFar', 'armNear'];

    function anchorPos(fig, ex) {
      if (ex.anchor === 'wrists') {
        return (fig.arms.far.wrist.x + fig.arms.near.wrist.x) / 2;
      }
      if (ex.anchor === 'pelvis') return fig.pelvis.x;
      if (ex.anchor === 'farAnkle') return fig.legs.far.ankle.x;
      return (fig.legs.far.ankle.x + fig.legs.near.ankle.x) / 2;
    }

    // 求解躯干倾角（俯卧撑专用）：让 A 组（手掌）与 B 组（脚尖）的最低点等高。
    // 先粗扫定位变号区间再二分：比在固定区间上直接二分稳健得多
    // （某些相位下区间端点可能同号，直接二分会收敛到错误的一端）。
    function solveParam(ex, u) {
      var cfg = ex.solve;
      function f(v) {
        var b = bottoms(buildPose(ex, u, v));
        return lowestOf(b, cfg.a) - lowestOf(b, cfg.b);
      }
      var N = 32, lo = cfg.lo, hi = cfg.hi, step = (hi - lo) / N;
      var prevV = lo, prevF = f(lo);
      if (prevF === 0) return lo;
      var bestV = lo, bestAbs = Math.abs(prevF);
      for (var i = 1; i <= N; i++) {
        var v = lo + step * i, fv = f(v);
        if (fv === 0) return v;
        if (Math.abs(fv) < bestAbs) { bestAbs = Math.abs(fv); bestV = v; }
        if (prevF * fv < 0) {
          var a = prevV, b = v, fa = prevF;
          for (var j = 0; j < 26; j++) {
            var m = (a + b) / 2, fm = f(m);
            if (fm === 0) return m;
            if (fa * fm < 0) { b = m; } else { a = m; fa = fm; }
          }
          return (a + b) / 2;
        }
        prevV = v; prevF = fv;
      }
      return bestV;
    }

    // 完整求解 + 落地吸附
    // airMode: 'off' 忽略腾空（用于标定比例，避免跳跃动作把整体比例压小）
    function solveFig(ex, u, airMode) {
      var param = ex.solve ? solveParam(ex, u) : null;
      var fig = buildPose(ex, u, param);
      var b = bottoms(fig);
      var low = lowestOf(b, ALL_PARTS);
      var want = ex.lift ? ex.lift(u) : 0;

      if (airMode === 'off') {
        fig.air = 0;
      } else {
        // 腾空高度受「头顶不出画框」限制：以姿势本身的高度为准算出余量。
        // 这样跳跃再高也不会把人物顶出画面，而比例又只由姿势决定。
        var heightNoAir = figExtent(fig).maxY - low;
        var room = (BOX_H / scaleOf()) - heightNoAir;
        fig.air = Math.max(0, Math.min(want, room));
      }
      fig.dy = fig.air - low;      // 平移到「轮廓最低点恰好落在 air 高度」

      // 双脚微错位：整体把两条腿沿水平方向错开一点，避免侧视时两条腿完全重合成一条线。
      // 正面视角两腿本来就由髋宽分开，不需要错位。
      if (ex.legOffset && ex.view !== 'front') {
        shiftLeg(fig, 'far', -ex.legOffset);
        shiftLeg(fig, 'near', ex.legOffset);
      }

      fig.ax = anchorPos(fig, ex);
      return fig;
    }

    function shiftLeg(fig, k, dx) {
      if (!dx) return;
      var g = fig.legs[k];
      [g.hip, g.knee, g.ankle, g.heel, g.toe].forEach(function (p) { p.x += dx; });
    }

    // 各部件在图中的包围盒（局部坐标，含线条粗细），用于自动缩放
    function figExtent(fig) {
      var e = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
      function put(p, r) {
        if (p.x - r < e.minX) e.minX = p.x - r;
        if (p.x + r > e.maxX) e.maxX = p.x + r;
        if (p.y - r < e.minY) e.minY = p.y - r;
        if (p.y + r > e.maxY) e.maxY = p.y + r;
      }
      // 形体有粗细（BODY 表 + 深蓝描边），包围盒必须按最宽处留足余量，
      // 否则缩放标定会偏小、身体边缘被画框裁掉。
      var pad = OUTLINE_HALF;
      put(fig.pelvis, RW.torso + pad); put(fig.chest, RW.torso + pad); put(fig.neck, RW.torso + pad);
      // 头是椭圆：包围盒要按【较大的那个半径】留余量，否则窄的那个方向
      // 看似够用，实际会把头的边缘裁掉。
      put(fig.head, Math.max(fig.headR, L.headRx) + pad + 1);
      ['far', 'near'].forEach(function (k) {
        var g = fig.legs[k], a = fig.arms[k];
        var lr = RW.leg + pad, ar = RW.arm + pad, fr = RW.foot + pad;
        put(g.hip, lr); put(g.knee, lr); put(g.ankle, lr);
        put(g.heel, fr); put(g.toe, fr);
        put(a.shoulder, ar); put(a.elbow, ar); put(a.wrist, ar);
      });
      return e;
    }

    // ============================================================
    // 7. 缩放与取景标定
    //    全部动作用同一个比例：切换动作时人物不会忽大忽小，
    //    跳跃与下蹲才表现为身体真的在上下移动，而不是整个画面在缩放。
    //    比例取「所有动作都不出框」的最大值，因此由最占空间的那个动作决定。
    // ============================================================
    var GROUND = 386, CX = 210, TOP = 18, SIDE_PAD = 22, TARGET_H = 306;

    var BOX_W = 420 - SIDE_PAD * 2;      // 水平可用宽 376
    var BOX_H = GROUND - TOP;            // 垂直可用高 368

    var REF_H = (function () {
      var fig = buildPose(STANDING, 0, null);
      var low = lowestOf(bottoms(fig), ALL_PARTS);
      return (fig.head.y + fig.headR) - low;    // 直立时的身高
    })();

    var SCALE = TARGET_H / REF_H;        // 先按「站姿目标身高」取，再被最占空间的动作压低
    var SCALE_BY = '站姿目标身高';

    // 扫描每个动作的整个周期，记录姿势包围盒（不含腾空高度）
    (function () {
      EXERCISES.concat([STANDING]).forEach(function (ex) {
        var frames = ex.solve ? 96 : 240;
        var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (var i = 0; i < frames; i++) {
          var fig = solveFig(ex, i / frames, 'off');
          var e = figExtent(fig);
          if (e.minX < minX) minX = e.minX;
          if (e.maxX > maxX) maxX = e.maxX;
          if (e.minY < minY) minY = e.minY;
          if (e.maxY > maxY) maxY = e.maxY;
        }
        // 地面固定在 y=0，纵向只需保证「姿势最高点」不出框
        var spanW = Math.max(1, maxX - minX);
        var needH = Math.max(1, maxY);
        ex.fitSpan = { minX: minX, maxX: maxX, minY: minY, maxY: maxY, w: spanW, h: maxY - minY };
        ex.needW = spanW;
        ex.needH = needH;
      });

      // 统一比例：所有动作里最严格的那个限制
      EXERCISES.forEach(function (ex) {
        var s = Math.min(BOX_W / ex.needW, BOX_H / ex.needH);
        if (s < SCALE) {
          SCALE = s;
          SCALE_BY = ex.name + '（' + (BOX_W / ex.needW < BOX_H / ex.needH ? '宽度' : '高度') + '）';
        }
      });
    })();

    function scaleOf() { return SCALE; }

    // ============================================================
    // 8. 渲染
    // ============================================================
    function $(id) { return document.getElementById(id); }

    var E = {
      scene: $('scene'),
      spine: $('spine'), spine2: $('spine2'), neckLine: $('neckLine'),
      shoulders: $('shoulders'),
      head: $('head'), face: $('face'), face2: $('face2'), mouth: $('mouth'),
      shadow: $('shadow'),
      badge: $('stageBadge'), view: $('stageView'), desc: $('figDesc')
    };

    var PARTS = {
      nearLeg: { grp: $('grpNearLeg'), upper: $('nearLegUpper'), lower: $('nearLegLower'),
        foot: $('nearFoot'), footSide: $('nearFootSide') },
      farLeg: { grp: $('grpFarLeg'), upper: $('farLegUpper'), lower: $('farLegLower'),
        foot: $('farFoot'), footSide: $('farFootSide') },
      nearArm: { grp: $('grpNearArm'), upper: $('nearArmUpper'), lower: $('nearArmLower') },
      farArm: { grp: $('grpFarArm'), upper: $('farArmUpper'), lower: $('farArmLower') }
    };
    var GRP_TORSO = $('grpTorso'), GRP_FACE = $('grpFace'), FIGURE = $('figure');

    // 深度排序：正面视角下按各部件「离镜头多近」决定绘制顺序。
    // 关键作用——朝镜头抬起的腿原本会被画在躯干下面，
    // 看上去就像腿长在身体背后（整体读成背影）；按深度排序后它会画到躯干之上。
    function depthOf(pts) {
      var z = 0;
      for (var i = 0; i < pts.length; i++) z += (pts[i].z || 0);
      return z / pts.length;
    }

    function sortByDepth(ex, fig) {
      // 眼睛组永远排在最后；手组紧随人物之后。
      // appendChild 会把组移动到末尾，不显式放进去的话会被深度排序压到人物之下而看不见。
      if (ex.view !== 'front') {
        // 侧面视角：远侧永远在后、近侧永远在前，顺序固定
        return [PARTS.farLeg.grp, PARTS.farArm.grp, GRP_TORSO, PARTS.nearLeg.grp, PARTS.nearArm.grp,
          GRP_FACE];
      }
      var layers = [
        { g: PARTS.farLeg.grp, ord: 0, z: depthOf([fig.legs.far.hip, fig.legs.far.knee, fig.legs.far.ankle]) },
        { g: PARTS.nearLeg.grp, ord: 1, z: depthOf([fig.legs.near.hip, fig.legs.near.knee, fig.legs.near.ankle]) },
        { g: PARTS.farArm.grp, ord: 2, z: depthOf([fig.arms.far.shoulder, fig.arms.far.elbow, fig.arms.far.wrist]) },
        { g: PARTS.nearArm.grp, ord: 3, z: depthOf([fig.arms.near.shoulder, fig.arms.near.elbow, fig.arms.near.wrist]) },
        { g: GRP_TORSO, ord: 4, z: 0 },
        { g: GRP_FACE, ord: 5, z: Infinity }    // 眼睛最上层
      ];
      // z 越大 = 越靠近镜头 = 越后画（压在上面）。
      // 深度几乎相同时用 ord 兜底，保证顺序稳定、不会逐帧抖动。
      layers.sort(function (a, b) {
        var d = a.z - b.z;
        return Math.abs(d) > 0.5 ? d : a.ord - b.ord;
      });
      return layers.map(function (l) { return l.g; });
    }

    // 画一段「圆头胶囊」：一条带圆头端点的粗线。
    // 用不同粗细的胶囊分段拼出肢体，视觉上就是有粗细变化的形体，
    // 而不是从头到尾一样粗的火柴棍。
    function seg(node, a, b, width) {
      node.setAttribute('x1', a.x.toFixed(1));
      node.setAttribute('y1', a.y.toFixed(1));
      node.setAttribute('x2', b.x.toFixed(1));
      node.setAttribute('y2', b.y.toFixed(1));
      node.setAttribute('stroke-width', width.toFixed(2));
    }

    function setCircle(node, p, r) {
      node.setAttribute('cx', p.x.toFixed(1));
      node.setAttribute('cy', p.y.toFixed(1));
      if (r !== undefined) node.setAttribute('r', r.toFixed(2));
    }

    // 正面视角的脚：正对镜头的鞋，画成偏矮的椭圆
    function setEllipse(node, p, rx, ry) {
      node.setAttribute('cx', p.x.toFixed(1));
      node.setAttribute('cy', p.y.toFixed(1));
      node.setAttribute('rx', rx.toFixed(2));
      node.setAttribute('ry', ry.toFixed(2));
    }

    var mirrorOn = false;

    function render(ex, fig) {
      var s = scaleOf();

      // 镜面反转：整体翻转 scene 组，人物与地面阴影一起翻，保证一致
      E.scene.setAttribute('transform', mirrorOn ? 'translate(420,0) scale(-1,1)' : '');
      // 正面视角下左右同等可见，不区分远近配色（见 CSS 里的 #scene.front 规则）
      E.scene.classList.toggle('front', ex.view === 'front');

      // 按深度重排绘制顺序（正面视角每帧都会变，侧面视角顺序固定）
      sortByDepth(ex, fig).forEach(function (g) { FIGURE.appendChild(g); });

      var ax = fig.ax, dy = fig.dy;
      // 水平居中：一律把该动作包围盒的中点对齐到画面中轴。
      // 只按锚点（脚踝等）居中会让躺姿动作整体偏出一侧而被裁掉。
      var span = ex.fitSpan;
      var centerOn = span ? (span.minX + span.maxX) / 2 : ax;
      function T(p) {
        return { x: CX + (p.x - centerOn) * s, y: GROUND - (p.y + dy) * s };
      }

      var pelvis = T(fig.pelvis), neck = T(fig.neck), head = T(fig.head);

      // ---- 躯干：分段胶囊拼出有腰线、肩线、脖颈的人形躯干 ----
      // 三段而不是一根直筒：腰（窄）→ 胸（宽）→ 颈（细）。
      // 颈部必须一直连到 neck 点，否则头会浮在身体上方脱开。
      var waist = T(lerpP(fig.pelvis, fig.neck, 0.18));
      var chest = T(lerpP(fig.pelvis, fig.neck, 0.55));
      seg(E.spine2, pelvis, waist, BODY.torsoWaist * 2 * s);   // 腰 → 略窄
      seg(E.spine, waist, chest, BODY.torsoChest * 2 * s);     // 腰 → 胸：最宽处
      seg(E.neckLine, chest, neck, BODY.neckW * 2 * s);        // 胸 → 颈：收细，托住头
      // 肩线：横向短胶囊。画在胸腔高度，只比胸腔略宽一点，
      // 超出太多躯干就会变成一个方盒子。
      var shL = T(fig.arms.near.shoulder), shR = T(fig.arms.far.shoulder);
      seg(E.shoulders, shL, shR, BODY.shoulder * 2 * s);

      // ---- 头：细长的椭圆（横半径 < 纵半径），不是正圆 ----
      setEllipse(E.head, head, L.headRx * s, L.headR * s);
      var eRx = L.headRx * s, eRy = L.headR * s;
      if (ex.view === 'front') {
        // 正面：两只眼 + 一张嘴。眼距/眼高/嘴位都按头的横纵半径取比例，
        // 换头型时五官会自动跟着缩放位置，不会跑出脸外。
        var eyeDx = eRx * 0.40, eyeDy = eRy * 0.26;
        setCircle(E.face, { x: head.x - eyeDx, y: head.y - eyeDy }, 2.6 * s);
        setCircle(E.face2, { x: head.x + eyeDx, y: head.y - eyeDy }, 2.6 * s);
        // 嘴：一条略带弧度的线（嘴角略上扬）
        var mw = eRx * 0.42, my = head.y + eRy * 0.42;
        E.mouth.setAttribute('d',
          'M' + (head.x - mw).toFixed(1) + ' ' + (my - 1.2 * s).toFixed(1) +
          'Q' + head.x.toFixed(1) + ' ' + (my + 2.4 * s).toFixed(1) +
          ' ' + (head.x + mw).toFixed(1) + ' ' + (my - 1.2 * s).toFixed(1));
        E.mouth.setAttribute('stroke-width', (2.4 * s).toFixed(2));
        E.mouth.setAttribute('opacity', '1');
      } else {
        // 侧面：一只眼 + 朝向前方的嘴。朝向由躯干与头角决定，躺下时五官也跟着转。
        var faceW = fig.angles.torso + fig.angles.head;
        var fo = walk({ x: 0, y: 0 }, faceW, eRx * 0.55);
        setCircle(E.face, { x: head.x + fo.x, y: head.y - fo.y + eRy * 0.22 }, 2.8 * s);
        setCircle(E.face2, { x: head.x + fo.x, y: head.y - fo.y }, 0.01 * s);
        var mo = walk({ x: 0, y: 0 }, faceW, eRx * 0.62);
        var mx = head.x + mo.x, myy = head.y - mo.y + eRy * 0.52;
        E.mouth.setAttribute('d',
          'M' + (mx - 2.2 * s).toFixed(1) + ' ' + myy.toFixed(1) +
          'q' + (2.6 * s).toFixed(1) + ' ' + (1.6 * s).toFixed(1) +
          ' ' + (4.4 * s).toFixed(1) + ' ' + (-0.6 * s).toFixed(1));
        E.mouth.setAttribute('stroke-width', (2.2 * s).toFixed(2));
        E.mouth.setAttribute('opacity', '1');
      }

      ['near', 'far'].forEach(function (k) {
        var leg = fig.legs[k], arm = fig.arms[k];
        var P = PARTS[k + 'Leg'], A = PARTS[k + 'Arm'];

        // ---- 腿：大腿粗、小腿细，两段胶囊 + 圆头相接 ----
        var hip = T(leg.hip), knee = T(leg.knee), ankle = T(leg.ankle);
        seg(P.upper, hip, knee, BODY.thigh * 2 * s);
        seg(P.lower, knee, ankle, BODY.shin * 2 * s);
        // ---- 脚 ----
        // 正面视角：脚是正对镜头的，画成一个偏矮的椭圆（宽 = 脚宽），侧视时隐藏。
        // 侧视/其它：脚沿踝→脚尖画一段短胶囊，正视时隐藏。
        // 两种形状不能共用同一个元素：<ellipse> 会忽略 x1/y1，<line> 会忽略 rx/ry，
        // 混用会留下一颗停在原地的「飞脚」。所以各自一个元素，按视角切换显隐。
        var frontView = ex.view === 'front';
        if (frontView) {
          var sole = T({ x: leg.ankle.x, y: leg.ankle.y - L.ankleH });
          setEllipse(P.foot, sole, BODY.footW * s, BODY.footH * s);
          P.footSide.setAttribute('stroke-width', '0');
        } else {
          seg(P.footSide, ankle, T(leg.toe), BODY.footW * 2 * s);
          P.foot.setAttribute('rx', '0');
          P.foot.setAttribute('ry', '0');
        }

        // ---- 臂：上臂粗、前臂细 ----
        var sh = T(arm.shoulder), el = T(arm.elbow), wr = T(arm.wrist);
        seg(A.upper, sh, el, BODY.upperArm * 2 * s);
        seg(A.lower, el, wr, BODY.foreArm * 2 * s);
      });

      // 地面阴影：腾空越高越小越淡；躺姿动作阴影跟着身体展开
      var air = fig.air || 0;
      var kk = clamp(1 - air / 260, 0.45, 1);
      var shadowW = ex.anchor === 'wrists' ? 96 : (ex.view === 'side' && fig.angles.torso > 40 ? 88 : 58);
      E.shadow.setAttribute('cx', CX.toFixed(1));
      E.shadow.setAttribute('cy', (GROUND + 5).toFixed(1));
      E.shadow.setAttribute('rx', (shadowW * s * kk).toFixed(1));
      E.shadow.setAttribute('ry', (9 * s * kk).toFixed(1));
    }

    // ============================================================
    // 9. 播放控制
    // ============================================================
    var playBtn = $('playBtn'), speedEl = $('speed'), speedVal = $('speedVal');
    var phaseEl = $('phase'), phaseVal = $('phaseVal'), tabsEl = $('exTabs');
    var mirrorEl = $('mirror'), mirrorWrap = $('mirrorWrap');

    var SPEED_MIN = 0.1, SPEED_MAX = 30;      // 倍速范围
    var SPEED_RANGE = SPEED_MAX / SPEED_MIN;  // 300

    // 滑块 0~1000 按对数映射到 0.1×~30×：低速段细腻，高速段也不用拖到底
    function sliderToSpeed(v) { return SPEED_MIN * Math.pow(SPEED_RANGE, v / 1000); }
    function speedToSlider(sp) { return Math.round(1000 * Math.log(sp / SPEED_MIN) / Math.log(SPEED_RANGE)); }

    var current = 0, speed = 0.7, phase = 0, playing = true, dragging = false, last = 0;

    EXERCISES.forEach(function (ex, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ex-tab';
      b.textContent = ex.name;
      b.addEventListener('click', function () { select(i); });
      tabsEl.appendChild(b);
    });

    function speedText(sp) {
      return (sp < 10 ? sp.toFixed(2) : sp.toFixed(1)) + '×';
    }

    function updateSpeedLabel() {
      var rate = EXERCISES[current].rate * speed;
      speedVal.textContent = speedText(speed) + ' · ' + (Math.round(rate * 600) / 10) + ' 次/分';
    }

    function draw(u) {
      var ex = EXERCISES[current];
      var fig = solveFig(ex, u);
      fig.u = u;
      render(ex, fig);
      if (!dragging) {
        phaseEl.value = Math.round(u * 1000);
        phaseVal.textContent = Math.round(u * 100) + '%';
      }
    }

    function select(i) {
      current = i;
      phase = 0;
      Array.prototype.forEach.call(tabsEl.children, function (b, k) {
        b.classList.toggle('active', k === i);
      });
      var ex = EXERCISES[i];
      E.badge.textContent = ex.name;
      E.view.textContent = ex.view === 'front' ? '正面视角' : '侧面视角';
      E.desc.textContent = '用线条绘制的火柴人正在做「' + ex.name + '」（' + ex.en +
        '），' + (ex.view === 'front' ? '正面' : '侧面') + '视角，关节角度由 JavaScript 逐帧计算，速度可调。';
      document.title = ex.name + ' · 运动小人 · Thomas455';

      // 镜面反转只对侧面视角有意义
      var canMirror = ex.view === 'side';
      mirrorWrap.classList.toggle('hidden', !canMirror);
      if (!canMirror) {
        mirrorEl.checked = false;
        mirrorOn = false;
        mirrorWrap.classList.remove('on');
      }

      updateSpeedLabel();
      draw(0);
    }

    function frame(now) {
      if (!last) last = now;
      var dt = (now - last) / 1000;
      last = now;
      if (dt > 0.12) dt = 0.12;               // 切回标签页时不要跳帧
      if (playing && !dragging) {
        phase = (phase + dt * speed * EXERCISES[current].rate) % 1;
        draw(phase);
      }
      window.requestAnimationFrame(frame);
    }

    playBtn.addEventListener('click', function () {
      playing = !playing;
      playBtn.textContent = playing ? '暂停' : '播放';
    });

    speedEl.addEventListener('input', function () {
      speed = sliderToSpeed(Number(speedEl.value));
      updateSpeedLabel();
    });

    Array.prototype.forEach.call(document.querySelectorAll('.preset'), function (b) {
      b.addEventListener('click', function () {
        speed = Number(b.getAttribute('data-speed'));
        speedEl.value = clamp(speedToSlider(speed), 0, 1000);
        updateSpeedLabel();
      });
    });

    mirrorEl.addEventListener('change', function () {
      mirrorOn = mirrorEl.checked;
      mirrorWrap.classList.toggle('on', mirrorOn);
      draw(phase);
    });

    phaseEl.addEventListener('input', function () {
      dragging = true;
      phase = Number(phaseEl.value) / 1000;
      phaseVal.textContent = Math.round(phase * 100) + '%';
      draw(phase);
    });
    ['change', 'pointerup', 'pointercancel', 'blur'].forEach(function (ev) {
      phaseEl.addEventListener(ev, function () { dragging = false; });
    });

    document.addEventListener('keydown', function (e) {
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
      if (e.key === ' ') {
        e.preventDefault();
        playBtn.click();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        var step = (e.key === 'ArrowLeft' ? -1 : 1) * 15;
        speedEl.value = clamp(Number(speedEl.value) + step, 0, 1000);
        speed = sliderToSpeed(Number(speedEl.value));
        updateSpeedLabel();
      } else if (e.key >= '1' && e.key <= '9') {
        var i = Number(e.key) - 1;
        if (i < EXERCISES.length) select(i);
      }
    });

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) last = 0;
    });

    // ============================================================
    // 10. 启动
    // ============================================================
    $('year').textContent = new Date().getFullYear();
    speed = sliderToSpeed(Number(speedEl.value));
    select(0);
    window.requestAnimationFrame(frame);

    // 便于调试 / 自动化检查
    window.ExFigure = {
      EXERCISES: EXERCISES, STANDING: STANDING,
      solveFig: solveFig, buildPose: buildPose, buildFront: buildFront, buildSide: buildSide,
      bottoms: bottoms, lowestOf: lowestOf, ALL_PARTS: ALL_PARTS, figExtent: figExtent,
      limbDir3: limbDir3, sliderToSpeed: sliderToSpeed, speedToSlider: speedToSlider,
      setMirror: function (v) { mirrorOn = !!v; mirrorEl.checked = !!v; draw(phase); },
      isMirror: function () { return mirrorOn; },
      REF_H: REF_H, SCALE: SCALE, SCALE_BY: SCALE_BY, BOX_W: BOX_W, BOX_H: BOX_H,
      CX: CX, GROUND: GROUND, TOP: TOP,
      L: L, R: R, BODY: BODY, OUTLINE_HALF: OUTLINE_HALF, select: select, draw: draw
    };
  })();
  </script>
<script src="../assets/js/tools-recent.js"></script>
<script src="../assets/js/baidu-analytics.js"></script>
</body>
